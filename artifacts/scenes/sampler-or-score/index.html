<title>Sampler or Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one square plot stays in place, and the side column carries the claim, the control and the reading. */
:root{--bg:#f7f9fb;--panel:#ffffff;--ink:#14263a;--muted:#566779;--line:#d5dee7;--faint:#e9eef3;
--e1:#1f8a4d;--e2:#7248cf;--base:#5f6f80;--sample:#d9480f;--score:#c2255c;--target:#14263a;--on:#14263a;--onink:#ffffff;
--display:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,sans-serif}
:root[data-theme="dark"]{--bg:#111a24;--panel:#18242f;--ink:#e6edf4;--muted:#9fb0c0;--line:#30404f;--faint:#223040;
--e1:#4fc98a;--e2:#a98bf0;--base:#93a3b3;--sample:#ff8a4c;--score:#f06595;--target:#e6edf4;--on:#e6edf4;--onink:#111a24;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.wrap{max-width:1160px;margin:0 auto;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.eyebrow{font:600 13px/1.3 var(--body);letter-spacing:.04em;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:0}
.note b{color:var(--ink);font-weight:600}
#theme{font:500 13px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.stage{display:grid;grid-template-columns:minmax(0,calc(100vh - 172px)) minmax(300px,1fr);gap:24px;align-items:start}
.fig{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:640px;width:100%}
.fig svg{display:block;width:100%;height:auto}
.side{min-width:0;display:flex;flex-direction:column;gap:12px}
.tag{font:600 13px/1.3 var(--body);color:var(--muted);min-height:17px}
h1{font:600 clamp(25px,3vw,33px)/1.12 var(--display);margin:2px 0 0;text-wrap:balance}
#cap{margin:0;font-size:17px;line-height:1.45;min-height:102px;max-width:62ch}
#ctl{display:flex;flex-direction:column;gap:10px;min-height:138px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{font:500 15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on)}
.range label{display:block;font-weight:500;font-size:15px;margin-bottom:2px}
.range input{width:100%;accent-color:var(--sample)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num b{display:block;font:600 25px/1.1 var(--display);font-variant-numeric:tabular-nums}
.num span{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:128px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:14px}
.track{position:relative;height:16px;background:var(--faint);border-radius:2px}
.fill{height:100%;border-radius:2px;transition:width .35s ease}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar output{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.barhead{font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav button{font:500 15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
#dots{display:flex;gap:6px}
#dots button{width:12px;height:12px;padding:0;border-radius:50%;background:var(--line);border:0}
#dots button[aria-current="true"]{background:var(--ink)}
#fnum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--line);padding-top:7px;font-size:15px}
summary{cursor:pointer;color:var(--muted);font-weight:500}
details h2{font:600 18px var(--display);margin:18px 0 6px}
details p{max-width:76ch;margin:6px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
:focus-visible{outline:3px solid var(--sample);outline-offset:2px}
svg text{font-family:var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
svg .tk{font-size:12px;fill:var(--muted)}
svg .lb{font-size:15px;font-weight:600}
svg .sm{font-size:13px;font-weight:500}
.pix{cursor:pointer}
@media(max-width:860px){.stage{grid-template-columns:minmax(0,1fr);gap:12px}.fig{max-width:520px;margin:0 auto}#cap{min-height:96px}#ctl{min-height:0}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<p>Catastrophic Compositional Generation calls the sampler error <b>inference-time approximation error</b>, d(P̃, P<sup>w</sup><sub>θ</sub>), and the score error <b>score estimation error</b>, d(P<sup>w</sup><sub>θ</sub>, P<sup>w</sup><sub>⋆</sub>). The triangle inequality bounds the total by their sum (PDF page 4).</p>
