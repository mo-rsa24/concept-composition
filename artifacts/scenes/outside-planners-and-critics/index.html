}

:root[data-theme="dark"]{

  --gain:#55cf9c;--loss:#ff8c98;--band:#2c384c;

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 18px/1.5 var(--prose);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;min-width:0}
.brand{font:400 19px/1.1 var(--title);color:var(--muted)}
.rail{display:flex;gap:4px;flex:1 1 420px;min-width:0}
.rail button{flex:1 1 0;min-width:0;background:none;border:0;border-top:4px solid var(--rule);padding:5px 2px 0;text-align:left;font:400 16px/1.05 var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rail button.done{border-top-color:var(--accent);opacity:.6}
.rail button[aria-current="true"]{border-top-color:var(--accent);color:var(--ink)}
.stage{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font:600 clamp(26px,3.1vw,40px)/1.1 var(--shout);text-wrap:balance}
#fig{flex:1 0 auto;display:flex;min-width:0}
#fig>.pic{margin:auto;width:100%;min-width:0;animation:rise .28s ease-out}
@keyframes rise{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
footer{display:grid;gap:7px;min-width:0}
#cap{margin:0;min-height:3em;max-width:80ch}
.foot{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
details{flex:1 1 300px;min-width:0;font-size:15px;color:var(--muted)}
summary{cursor:pointer;font:400 16px/1.5 var(--label);letter-spacing:.06em;text-transform:uppercase}
#src{max-height:24vh;overflow:auto;padding:6px 2px;max-width:82ch}
#src p{margin:0 0 6px}
#src .left{color:var(--ink);border-left:3px solid var(--accent);padding-left:9px}
.ctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.ctl button{min-height:42px;min-width:74px;border:1px solid var(--rule);background:var(--panel);border-radius:7px;padding:4px 14px;font-weight:600}
.ctl #next{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.ctl button:disabled{opacity:.38;cursor:default}
#fnum{font:400 15px var(--data);color:var(--muted);min-width:4.2em;text-align:center}

.lb{font:400 16px/1.1 var(--label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.nd{background:var(--panel);border:1.5px solid var(--rule);border-radius:9px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:5px}
.nd.out{border:2px dashed var(--hot);background:var(--hot-soft)}
.nd.out .lb{color:var(--hot)}
.nd.lit{box-shadow:0 0 0 3px var(--accent)}
.nd.past{opacity:.62}
.nd.off,.ar.off{visibility:hidden}
.big{font:500 25px/1.1 var(--data)}
.ill{font-size:13px;color:var(--muted);font-style:italic}
.flow{display:grid;grid-template-columns:minmax(0,1.15fr) 42px minmax(0,.7fr) 42px minmax(0,1fr);align-items:center;max-width:1000px;margin:auto}
.ar{display:block;width:34px;height:22px;margin:auto;stroke:var(--muted);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ar.hotline{stroke:var(--hot)}
.q{margin:0;font-size:19px;line-height:1.4}
.scene{display:block;width:100%;height:auto;max-height:230px;border-radius:5px}
.p0{color:var(--r0);font-weight:600}.p1{color:var(--r1);font-weight:600}.p2{color:var(--r2);font-weight:600}.p3{color:var(--r3);font-weight:600}

.track{display:flex;gap:5px;list-style:none;padding:0;margin:0 0 10px;max-width:520px}
.track li{flex:1;text-align:center;padding:3px 4px;border-radius:5px;background:var(--shade);font:400 16px/1.2 var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.track li[aria-current="step"]{background:var(--accent);color:var(--panel)}
.rec{display:grid;grid-template-columns:minmax(0,.9fr) 42px minmax(0,1.5fr);align-items:center;max-width:1000px}
.subs{display:grid;gap:7px}
.sub{border-left:5px solid;padding:3px 9px;background:var(--panel);font-size:16px;line-height:1.3;border-radius:0 5px 5px 0}

.plan{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);gap:24px;align-items:center;max-width:980px}
.str{font:500 clamp(24px,3.1vw,36px)/1.2 var(--data);white-space:nowrap}
.str .h{color:var(--accent)}.str .s{color:var(--muted)}
.read{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.read span{font:400 14px var(--data);background:var(--shade);padding:3px 7px;border-radius:4px}
.read b{color:var(--accent);font-weight:500}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:15px;line-height:1.2}
.seg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.canvas{display:flex;flex-direction:column;gap:3px;aspect-ratio:4/3;width:100%;max-width:440px;max-height:340px;margin:auto;background:var(--shade);padding:3px;border-radius:6px}
.crow{display:flex;gap:3px;min-height:0}
.cell{min-width:0;border:2px solid;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;font-size:15px;line-height:1.15;font-weight:600;overflow:hidden;gap:2px;background:var(--panel)}
.cell small{font-weight:400;font-size:13px;line-height:1.15}
.cell svg{width:38px;height:38px;flex:none}
.gen{max-width:560px;margin:auto}
.gen .canvas{max-width:560px;max-height:380px}
.blend{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:auto}
.tile{display:grid;gap:5px;justify-items:center;text-align:center}
.lat{width:clamp(104px,15vw,158px);aspect-ratio:1;display:flex;flex-direction:column;gap:2px;padding:2px;background:var(--shade);border-radius:5px}
.lr{display:flex;gap:2px;min-height:0}
.lat i{display:block;flex:1 1 0;min-width:0}
.wt{font:500 22px var(--data)}
.op{font:500 30px var(--data);color:var(--muted)}

.prompt{margin:0 auto 10px;max-width:820px;background:var(--panel);border:1.5px solid var(--rule);border-radius:9px;padding:6px 12px;font-size:17px;text-align:center}
.loop{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);grid-template-rows:auto 36px auto;max-width:820px;margin:auto}
.loop .nd{min-height:116px}
.rt{transform:rotate(90deg)}.lf{transform:rotate(180deg)}.up{transform:rotate(-90deg)}
.fb{display:flex;align-items:center;justify-content:center;gap:4px;font:400 15px/1 var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--hot)}
.fb .ar{width:26px;margin:0}

.mini{display:block;width:100%;height:58px}

.txt{font-size:15px;line-height:1.25}

.bars{display:grid;gap:9px;max-width:820px;margin:auto;width:100%}

.crw .x{border-color:var(--hot);background:var(--hot-soft)}
.crw.off{visibility:hidden}
.crw.new>div{animation:rise .28s ease-out}

.lock.free svg{stroke:var(--accent)}

.cg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.cg .gap{width:12px}

.dr.sel{font-weight:600}
.dt{position:relative;height:22px;background:linear-gradient(var(--rule),var(--rule)) center/100% 1px no-repeat}
.dr.ax .dt{height:18px;background:none;font:400 15px/18px var(--label);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}

.note{font:400 14px var(--data);color:var(--muted);text-align:center;margin-top:4px}

  .dt{height:19px}.dv{font-size:12.5px}
  .seg{padding:4px 7px;font-size:13px}
}

function track(k){return '<ol class="track">'+["Recaption","Plan","Generate"].map((s,j)=>`<li${j===k?' aria-current="step"':""}>${s}</li>`).join("")+"</ol>";}
function parse(s){return s.split(";").map(r=>{const n=r.split(",").map(Number);return{h:n[0],cols:n.slice(1)};});}
function canvas(mode){
  const fig4=state.split==="1,1,1;2,2,3"; let k=0;
  const rows=parse(state.split).map(r=>{
    const cells=r.cols.map(c=>{
      const id=k++;
      const inner=mode==="gen"?`${G[id]}<span>${SUBS[id]}</span>`:(fig4?`<span>${NAMES[id]}</span><small>region ${id}</small>`:`<span>region ${id}</span>`);
      return `<div class="cell" style="flex:${c} 1 0;border-color:var(--r${id});background:color-mix(in srgb,var(--r${id}) 20%,var(--panel))">${inner}</div>`;
    }).join("");
    return `<div class="crow" style="flex:${r.h} 1 0">${cells}</div>`;
  }).join("");
  return `<div class="canvas" role="img" aria-label="Canvas divided by split ratio ${state.split}">${rows}</div>`;
}
function splitString(){
  return state.split.split(";").map(r=>{const n=r.split(",");return `<span class="h">${n[0]}</span><span class="s">,</span>${n.slice(1).join('<span class="s">,</span>')}`;}).join('<span class="s">;</span>');
}
function drawPlan(){
  const p=parse(state.split);
  const reads=`<span>rows <b>${p[0].h}:${p[1].h}</b></span><span>top row <b>${p[0].cols.join(":")}</b></span><span>bottom row <b>${p[1].cols.join(":")}</b></span>`;
  const b=(v,l)=>`<button class="seg" type="button" data-split="${v}" aria-pressed="${state.split===v}">${l}</button>`;
  return `<div class="pic">${track(1)}<div class="plan"><div><div class="lb">The plan the language model writes</div><div class="str">${splitString()}</div><div class="read">${reads}</div><div class="presets" data-optional>${b("1,1,1;2,2,3","Plan in Fig. 4")}${b("1,1,1;2,1,1","Example in Fig. 5")}</div></div>${canvas("plan")}</div></div>`;
}
function loop(k){
  const on=(lit,from)=>k===lit?"lit":(k>=from?"past":"off");
  const a=(n,c)=>ar((k>=n?"":"off ")+c);
  return `<div class="pic"><p class="prompt">“A photo of <b>77 Donuts</b> in a shop named Fury Donuts written in pink”</p><div class="loop">
  <div class="nd out ${k===0||k===3?"lit":"past"}" style="grid-area:1/1"><div class="lb">Design VLM</div>${GRAPH}<div class="txt">Parsed: 77 donuts, “Fury Donuts” in pink</div><div class="ill">illustrative graph</div></div>
  <div style="grid-area:1/2;align-self:center">${a(0,"")}</div>
  <div class="nd ${k===0?"lit":"past"}" style="grid-area:1/3"><div class="lb">Layout</div>${LAYOUT}<div class="ill">illustrative layout</div></div>
  <div style="grid-area:2/3;align-self:center">${a(1,"rt")}</div>
  <div class="nd ${on(1,1)}" style="grid-area:3/3"><div class="lb">Image generator</div>${IMG}<div class="txt">mask + IP-Adapter + Stable Diffusion</div><div class="ill">illustrative: not 77 donuts</div></div>
  <div style="grid-area:3/2;align-self:center">${a(2,"lf")}</div>
  <div class="nd out ${on(2,2)}" style="grid-area:3/1"><div class="lb">Critic VLM</div><div class="txt">Count right? Looks good?</div><div class="chk"><span>GroundingDINO</span><span>Q-Align</span></div></div>
  <div class="fb ${k===3?"go":""}" style="grid-area:2/1;${k===3?"":"visibility:hidden"}">${ar("up hotline")}<span>updates the plan</span></div>
  </div></div>`;
}
function drawCost(k){
  const row=(n,a,b,c,cls,x)=>`<div class="crw ${cls}"><div>${n}</div><div data-l="Outside model" class="${x?"x":""}">${a}</div><div data-l="Extra calls" class="${x?"x":""}">${b}</div><div data-l="New dependency" class="${x?"x":""}">${c}</div></div>`;
  return `<div class="pic"><div class="cost"><div class="crw h"><div></div><div>Outside model</div><div>Extra calls</div><div>New dependency</div></div>
  ${row("Plain","none","none","none","",false)}
  ${row("RPG","a language model (GPT-4 in the paper)","before sampling, for phrases, subprompts and the region plan","the regions come from its plan",k===0?"new":"",true)}
  ${row("CountLoop","Design VLM, Critic VLM, GroundingDINO, Q-Align","a new critique every round until objectives are met","their scores steer repairs and end the loop",k===1?"new":"off",true)}
  </div></div>`;
}
function drawLocks(){
  const items=[["Prompts",""],["Seeds",""],["Scheduler",""],["Resolution",""],["Sampling budget","25 steps SD3.5, 30 FLUX.2"]];
  return '<div class="pic"><div class="locks">'+items.map(x=>`<div class="lock">${LOCK}<span>${x[0]}${x[1]?`<small>${x[1]}</small>`:""}</span></div>`).join("")+`<div class="lock free">${UNLOCK}<span>Guidance rule<small>and its chosen settings</small></span></div></div></div>`;
}
const fmt=(d,dp)=>(d>0?"+":d<0?"−":"")+Math.abs(d).toFixed(dp);
function drawDots(){
  const {model:mo,metric:me}=state, dp=me==="DPG"?2:3, m=MARGIN[mo][me], base=T1[`CFG|${mo}|${me}`][0];
  const rows=METHODS.map(x=>{const c=T1[`${x}|${mo}|${me}`];return{x,d:+(c[0]-base).toFixed(4),cl:c[1]};});
  const L=Math.max(m,...rows.map(r=>Math.abs(r.d)))*1.16;
  const pos=d=>50+d/L*50;
  const sym={gain:"▲",loss:"▼",none:"○"};
  const word={gain:"resolved gain",loss:"resolved loss",none:"inside the margin"};
  const body=rows.map(r=>`<div class="dr ${r.x==="SAG"?"sel":""}"><span>${r.x}</span><div class="dt"><i class="bandf" style="left:${pos(-m)}%;width:${m/L*100}%"></i><i class="zero" style="left:50%"></i><span class="m ${r.cl}" style="left:${pos(r.d)}%" title="${word[r.cl]}">${sym[r.cl]}</span></div><span class="dv">${fmt(r.d,dp)}</span></div>`).join("");
  const noCfg=T1[`no-CFG|${mo}|${me}`][0]-base;
  const mb=MODELS.map(x=>`<button class="seg" type="button" data-model="${x[0]}" aria-pressed="${mo===x[0]}">${x[1]}</button>`).join("");
  const eb=METRICS.map(x=>`<button class="seg" type="button" data-metric="${x[0]}" aria-pressed="${me===x[0]}">${x[1]}</button>`).join("");
  return `<div class="pic"><div class="dots"><div class="cg" data-optional>${mb}<span class="gap"></span>${eb}</div>
  <div class="dr ax"><span></span><div class="dt"><span>◀ below CFG</span><span>grey band ±${m}</span><span>above CFG ▶</span></div><span class="dv">vs CFG</span></div>${body}
  <div class="note">▲ ▼ past the margin, ○ inside it. no-CFG: ${fmt(noCfg,dp)}, off this scale.</div></div></div>`;
}

const $=id=>document.getElementById(id);
let i=0;
$("rail").innerHTML=CH.map((c,k)=>`<button type="button" data-ch="${k}">${c}</button>`).join("");
function paint(){
  const p=P[i];
  $("ttl").textContent=p.t; $("cap").textContent=p.cap; $("src").innerHTML=p.src; $("fig").innerHTML=p.d();
  $("fnum").textContent=`${i+1} / ${P.length}`;
  $("prev").disabled=i===0; $("next").disabled=i===P.length-1;
  document.querySelectorAll("#rail button").forEach(b=>{const k=+b.dataset.ch;b.setAttribute("aria-current",k===p.c?"true":"false");b.classList.toggle("done",k<p.c);});
}
function go(n){
  const nx=Math.max(0,Math.min(P.length-1,n)); if(nx===i&&$("ttl").textContent)return; i=nx; paint();
  try{const h="#p"+(i+1); if(location.hash!==h)history.replaceState(null,"",h);}catch(e){}
}
function fromHash(){const m=/^#p(\d+)$/.exec(location.hash||""); if(m)go(+m[1]-1);}
$("prev").onclick=()=>go(i-1); $("next").onclick=()=>go(i+1);
$("rail").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return; go(P.findIndex(p=>p.c===+b.dataset.ch));});
$("fig").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.split)state.split=b.dataset.split;
  if(b.dataset.model)state.model=b.dataset.model;
  if(b.dataset.metric)state.metric=b.dataset.metric;
  paint();
});
addEventListener("keydown",e=>{ if(e.altKey||e.ctrlKey||e.metaKey)return; if(e.key==="ArrowRight"){e.preventDefault();go(i+1);} if(e.key==="ArrowLeft"){e.preventDefault();go(i-1);} });
addEventListener("hashchange",fromHash);
paint(); fromHash();
})();
</script>
