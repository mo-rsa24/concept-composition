<title>The Commitment Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Marhey:wght@500&family=Mouse+Memoirs&family=Public+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: one figure that stays put on the left, the formula and one sentence on the right. */
:root{
  --paper:#ffffff;--panel:#f6f8fb;--ink:#172033;--muted:#5b667a;--rule:#d9dfe9;--shade:#eef2f7;
  --accent:#0b7a75;--accent-soft:#d6f0ee;--ts:#b4236b;--ts-soft:#fbe3ef;--ok:#2f7d32;
  --a:#2b6cb0;--b:#c77700;--noise:#6b7a90;
  --shout:"Marhey","Trebuchet MS",system-ui,sans-serif;
  --label:"Mouse Memoirs","Trebuchet MS",system-ui,sans-serif;
  --prose:"Public Sans",system-ui,sans-serif;
  --data:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10151f;--panel:#182030;--ink:#e8edf6;--muted:#a0acc0;--rule:#2d384b;--shade:#1e2838;
  --accent:#3fc7bf;--accent-soft:#143b3a;--ts:#f06aa8;--ts-soft:#43182e;--ok:#79c97c;
  --a:#6ea8ec;--b:#f0a93b;--noise:#93a1b6;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151f;--panel:#182030;--ink:#e8edf6;--muted:#a0acc0;--rule:#2d384b;--shade:#1e2838;
  --accent:#3fc7bf;--accent-soft:#143b3a;--ts:#f06aa8;--ts-soft:#43182e;--ok:#79c97c;
  --a:#6ea8ec;--b:#f0a93b;--noise:#93a1b6;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--prose);font-size:18px;line-height:1.5;overflow-x:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;min-width:0}
h1{font-family:var(--shout);font-weight:500;font-size:clamp(23px,2.5vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.dest{font-family:var(--prose);font-size:15.5px;color:var(--muted)}
.body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:24px;min-height:0}
.figwrap{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:8px}
#fig{display:block;width:100%;height:100%;max-width:880px}
#fig text{font-family:var(--prose);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
#fig text.ax{font-family:var(--label);letter-spacing:.06em}
#fig text.num{font-family:var(--data)}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding-right:2px}
#eq{min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:var(--shade);border-radius:8px;padding:12px 14px;overflow-x:auto}
.line{display:flex;align-items:flex-start;justify-content:center;gap:7px;flex-wrap:nowrap;white-space:nowrap;font-size:27px}
.line.prev{font-size:17px;color:var(--muted);opacity:.8}
.pc{display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.pc .pt{font-family:var(--prose);font-size:13.5px;color:var(--muted);line-height:1.2;white-space:nowrap}
.pc.sub{margin-left:-6px}
.pc.sub .ps{font-size:.66em;transform:translateY(.5em)}
.pc.sub .pt{margin-top:.15em}
.pc.off .ps{opacity:.3}
.pc.new .ps{color:var(--accent)}
.pc.new .pt{color:var(--accent)}
.pc.ts .ps,.pc.ts .pt{color:var(--ts)}
#cap{margin:0;min-height:5.2em;max-width:34em}
#status{font-family:var(--data);font-size:15.5px;color:var(--accent);min-height:1.5em}
#ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
#ctl label{grid-column:1/-1;font-family:var(--prose);font-size:15px;color:var(--muted)}
#rng{width:100%;accent-color:var(--accent);min-height:28px}
#rngV{font-family:var(--data);font-size:15px;min-width:5.2em;text-align:right}
details{font-size:15.5px;color:var(--muted)}
summary{cursor:pointer;font-family:var(--label);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
#moreBody{margin-top:8px;line-height:1.5}
#moreBody p{margin:0 0 8px}
#moreBody a{color:var(--accent)}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.btn{border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:6px;min-width:44px;min-height:38px;padding:4px 12px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--ts);outline-offset:2px}
.subbar{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 380px}
#sTxt{font-size:15.5px;flex:1 1 auto;min-width:0}
#sDots{display:flex;gap:4px}
#sDots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
#sDots i.on{background:var(--accent)}
#fnum{font-family:var(--data);font-size:14px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:3px;flex-wrap:wrap}
.nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-family:var(--label);font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;cursor:pointer;min-height:32px}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto auto}
  .body{grid-template-columns:minmax(0,1fr);gap:12px}
  .figwrap{aspect-ratio:600/470}
  .side{overflow:visible}
  #cap{min-height:6.5em}
  .line{font-size:22px}
  #eq{min-height:92px}
  .subbar{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1 id="title"></h1>
    <span class="dest">Taking apart T<sub>s</sub> = ½ ln λ<sub>max</sub>, the time scale on which a sample commits to a class</span>
  </header>
  <main class="body">
    <div class="figwrap"><svg id="fig" viewBox="0 0 600 470" role="img" aria-label="Figure for the current step"></svg></div>
    <div class="side">
      <div id="eq" aria-live="polite"></div>
      <p id="cap" class="cap"></p>
      <div id="status"></div>
      <div id="ctl" hidden><label for="rng" id="rngL"></label><input type="range" id="rng"><output id="rngV" for="rng"></output></div>
      <details id="more"><summary>Where these numbers come from</summary><div id="moreBody"></div></details>
    </div>
  </main>
  <footer class="foot">
    <div class="subbar" id="fSub"><button class="btn" id="sPrev" aria-label="Previous">◀</button><button class="btn primary" id="sNext" aria-label="Next">▶</button><span id="sTxt"></span><span id="sDots"></span></div>
    <span id="fnum"></span>
    <nav class="nav" id="nav" aria-label="Frames"></nav>
  </footer>
</div>

const K=tex=>{if(kCache[tex])return kCache[tex];
  let h;try{h=katex.renderToString(tex,{output:'mathml',throwOnError:true})}catch(e){h=tex}
  return kCache[tex]=h};
const P=(tex,tag,state)=>`<span class="pc ${state||''}"><span class="ps">${K(tex)}</span>${tag?`<span class="pt">${tag}</span>`:''}</span>`;
const row=(items,cls)=>`<div class="line ${cls||''}">${items.join('')}</div>`;

/* SVG helpers. */
const LM='λ<tspan dy="4" font-size=".72em">max</tspan><tspan dy="-4">​</tspan>';
const TSV='T<tspan dy="4" font-size=".72em">s</tspan><tspan dy="-4">​</tspan>';
const TX=(x,y,s,o={})=>`<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" text-anchor="${o.a||'start'}" fill="${o.f||'var(--ink)'}" font-size="${o.s||16}" class="${o.c||''}"${o.w?` font-weight="${o.w}"`:''}${o.o!==undefined?` opacity="${o.o}"`:''}>${s}</text>`;
const LN=(a,b,c,d,col,w,dash,op)=>`<line x1="${(+a).toFixed(1)}" y1="${(+b).toFixed(1)}" x2="${(+c).toFixed(1)}" y2="${(+d).toFixed(1)}" stroke="${col}" stroke-width="${w||1.5}"${dash?` stroke-dasharray="${dash}"`:''}${op!==undefined?` opacity="${op}"`:''} stroke-linecap="round"/>`;
const DOT=(x,y,r,col,op,extra)=>`<circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="${r}" fill="${col}"${op!==undefined?` opacity="${op}"`:''} ${extra||''}/>`;
const PATH=(pts,col,w,op,dash)=>`<polyline fill="none" stroke="${col}" stroke-width="${w||2}" stroke-linejoin="round" stroke-linecap="round"${op!==undefined?` opacity="${op}"`:''}${dash?` stroke-dasharray="${dash}"`:''} points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
const setFig=s=>{$('fig').innerHTML=s};
const CX=300,CY=235,SC=25,wx=x=>CX+x*SC,wy=y=>CY-y*SC;
const cls=c=>c>0?'var(--a)':'var(--b)';
function cloudAt(t,sc,cx,cy,r,op){
  const e=Math.exp(-t),b=Math.sqrt(Math.max(0,1-e*e));let s='';
  for(const p of D.pts){s+=DOT(cx+(e*p[0]+b*p[2])*sc,cy-(e*p[1]+b*p[3])*sc,r,cls(p[4]),op)}
  return s;
}

/* Frame 1: the widest spread. */
function drawLambda(){
  const k=stepK(),now=nowf(k),th=val('ang')*Math.PI/180,dx=Math.cos(th),dy=Math.sin(th);let s='';
  if(k>=1){
    const R=225*now(1);
    s+=LN(CX-R*dx,CY+R*dy,CX+R*dx,CY-R*dy,'var(--accent)',2.5);
    for(const p of D.pts){const q=(p[0]*dx+p[1]*dy)*SC;s+=DOT(CX+q*dx,CY-q*dy,1.7,'var(--accent)',.32*now(1))}
  }
  for(const p of D.pts)s+=DOT(wx(p[0]),wy(p[1]),2.8,cls(p[4]),k>=1?.42:.72);
  const mx=wx(D.m[0]),my=wy(D.m[1]),nx=wx(-D.m[0]),ny=wy(-D.m[1]);
  s+=DOT(mx,my,4.5,'var(--ink)')+DOT(nx,ny,4.5,'var(--ink)');
  s+=TX(mx+10,my-34,'class at +m',{f:'var(--a)',w:600})+TX(nx-10,ny+44,'class at −m',{a:'end',f:'var(--b)',w:600});
  if(k>=1){
    const v=1+M2*Math.pow(Math.cos(th-Math.PI/6),2);
    const lx=clamp(CX+218*dx,70,530),ly=clamp(CY-218*dy-12,24,446);
    s+=TX(lx,ly,`spread ${f2(v)}`,{a:'middle',f:'var(--accent)',w:600,c:'num'});
  }
  if(k>=3){
    const p=now(3);
    s+=LN(CX,CY,lerp(CX,mx,p),lerp(CY,my,p),'var(--ts)',3);
    s+=`<circle cx="${nx}" cy="${ny}" r="${(25*p).toFixed(1)}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    s+=TX(CX+8,CY+24,'|m|² = 19',{f:'var(--ts)',w:600,o:p});
    s+=TX(nx+32,ny+7,'variance 1 inside a class',{w:600,o:p});
  }
  setFig(s);
}

/* Frame 2: the shrink. */
function drawShrink(){
  const k=stepK(),now=nowf(k),t=val('t2'),e=Math.exp(-t);let s='';
  for(const p of D.pts)s+=DOT(wx(p[0]),wy(p[1]),2.4,cls(p[4]),.14);
  for(const p of D.pts)s+=DOT(wx(p[0]*e),wy(p[1]*e),2.8,cls(p[4]),.78);
  s+=TX(584,30,`t = ${f2(t)}`,{a:'end',c:'num',s:18,w:500})+TX(584,52,'data part only, noise comes next',{a:'end',s:14,f:'var(--muted)'});
  if(k>=1){
    const p=D.pts[0],a=[wx(p[0]),wy(p[1])],b=[wx(p[0]*e),wy(p[1]*e)];
    s+=LN(a[0],a[1],b[0],b[1],'var(--ts)',2.5)+DOT(a[0],a[1],5,'none',1,'stroke="var(--ts)" stroke-width="2"')+DOT(b[0],b[1],5,'var(--ts)');
    s+=TX(a[0]+10,a[1]-9,`one dot × ${f2(e)}`,{f:'var(--ts)',w:600});
  }
  if(k>=2){
    const p=now(2),x=28,y=28,w=112,iw=w*e;
    s+=`<g opacity="${p.toFixed(2)}"><rect x="${x}" y="${y}" width="${w}" height="${w}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`+
       `<rect x="${x}" y="${(y+w-iw).toFixed(1)}" width="${iw.toFixed(1)}" height="${iw.toFixed(1)}" fill="var(--accent)" opacity=".7"/></g>`;
    s+=TX(x,y+w+22,`side ${f2(e)}`,{o:p,c:'num',s:15});
    s+=TX(x,y+w+42,`area ${f2(e*e)}`,{o:p,c:'num',s:15,f:'var(--accent)',w:500});
  }
  setFig(s);
}

/* Shared time axis for the variance charts. */
const CH={x0:62,x1:582,y0:424,y1:24};
const cx=t=>CH.x0+t/3*(CH.x1-CH.x0);
function axisT(label){
  let s=LN(CH.x0,CH.y0,CH.x1,CH.y0,'var(--muted)',1.2);
  for(const t of [0,1,2,3]){s+=LN(cx(t),CH.y0,cx(t),CH.y0+5,'var(--muted)',1.2)+TX(cx(t),CH.y0+21,t,{a:'middle',c:'num',s:14,f:'var(--muted)'})}
  return s+TX((CH.x0+CH.x1)/2,CH.y0+41,label,{a:'middle',c:'ax',s:17,f:'var(--muted)'});
}

/* Frame 3: the crossing. */
function drawCross(){
  const k=stepK(),now=nowf(k),t=val('t3'),y=v=>CH.y0-v/21*(CH.y0-CH.y1);let s=axisT('t, how long noising has run');
  s+=LN(CH.x0,CH.y0,CH.x0,CH.y1,'var(--muted)',1.2);
  for(const v of [0,5,10,15,20]){s+=TX(CH.x0-8,y(v)+5,v,{a:'end',c:'num',s:14,f:'var(--muted)'})}
  s+=TX(CH.x0+7,CH.y1+6,'variance',{c:'ax',s:17,f:'var(--muted)'});
  const ix=330,iy=20,iw=252,ih=200;
  s+=`<rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" rx="6" fill="var(--shade)"/>`;
  s+=cloudAt(t,12,ix+iw/2,iy+ih/2,2,.62);
  s+=TX(ix+iw-8,iy+ih-9,`the cloud at t = ${f2(t)}`,{a:'end',s:14,c:'num'});
  const pts=[];for(let i=0;i<=120;i++){const u=i/120*3;pts.push([cx(u),y(LAM*Math.exp(-2*u))])}
  s+=PATH(pts,'var(--accent)',3);
  s+=TX(cx(.31),y(14.2),`signal left, ${LM}e<tspan dy="-6" font-size=".72em">−2t</tspan><tspan dy="6">​</tspan>`,{f:'var(--accent)',w:600});
  if(k>=1){const p=now(1);s+=LN(CH.x0,y(1),lerp(CH.x0,CH.x1,p),y(1),'var(--noise)',2.5,'7 4');
    s+=TX(CH.x1-2,y(1)-9,'noise settles at 1',{a:'end',f:'var(--noise)',w:600,o:p})}
  const v=LAM*Math.exp(-2*t);
  s+=LN(cx(t),CH.y0,cx(t),y(v),'var(--ink)',1,'3 3')+DOT(cx(t),y(v),5.5,'var(--ink)');
  if(k>=2){const p=now(2),X=cx(T0),Y=y(1);
    s+=LN(X,CH.y0,X,Y,'var(--ts)',2,'',p)+DOT(X,Y,8*p,'var(--ts)');
    s+=TX(X-4,Y-44,`${TSV} ≈ ${f3(T0)}`,{a:'middle',f:'var(--ts)',w:600,s:18,o:p})+LN(X,Y-36,X,Y-11,'var(--ts)',1.5,'',p)}
  setFig(s);
}

/* Frame 4: solve it, one move per press. */
const SOLVE=[
  {tex:String.raw`\lambda_{\max}\,e^{-2t}=1`,tag:'signal equals 1'},
  {tex:String.raw`\ln\!\big(\lambda_{\max}\,e^{-2t}\big)=\ln 1`,tag:'take ln of both sides'},
  {tex:String.raw`\ln\lambda_{\max}+\ln e^{-2t}=\ln 1`,tag:'a product becomes a sum'},
  {tex:String.raw`\ln\lambda_{\max}-2t=\ln 1`,tag:'ln undoes e'},
  {tex:String.raw`\ln\lambda_{\max}-2t=0`,tag:'ln 1 is 0'},
  {tex:String.raw`\ln\lambda_{\max}=2t`,tag:'add 2t to both sides'},
  {tex:String.raw`t=\tfrac12\ln\lambda_{\max}`,tag:'halve both sides'},
  {tex:String.raw`T_s=\tfrac12\ln 20\approx ${f3(T0)}`,tag:'put in 20',ts:1}
];
function drawSolve(){
  const k=stepK(),now=nowf(k),m=k===0?0:(k===1?ease(AP):1);
  const yL=v=>CH.y0-v/21*(CH.y0-CH.y1),mid=(CH.y0+CH.y1)/2,yG=v=>mid-Math.log(v)/3.25*(CH.y0-CH.y1)/2;
  const y=v=>lerp(yL(v),yG(v),m);let s=axisT('t');
  s+=LN(CH.x0,CH.y0,CH.x0,CH.y1,'var(--muted)',1.2);
  if(m<.5){for(const v of [0,10,20])s+=TX(CH.x0-8,yL(v)+5,v,{a:'end',c:'num',s:14,f:'var(--muted)',o:1-2*m})}
  else{for(const g of [-2,0,2])s+=TX(CH.x0-8,mid-g/3.25*(CH.y0-CH.y1)/2+5,g,{a:'end',c:'num',s:14,f:'var(--muted)',o:2*m-1})}
  s+=TX(CH.x1,CH.y1+6,m<.5?'signal':'ln of signal',{a:'end',c:'ax',s:17,f:'var(--muted)'});
  const one=y(1);
  s+=LN(CH.x0,one,CH.x1,one,k>=4?'var(--ts)':'var(--noise)',k>=4?2.5:2,k>=4?'':'7 4');
  s+=TX(CH.x1-2,one-9,k>=4?'ln 1 = 0':(k>=1?'ln 1':'noise settles at 1'),{a:'end',f:k>=4?'var(--ts)':'var(--noise)',w:600});
  const pts=[];for(let i=0;i<=120;i++){const u=i/120*3;pts.push([cx(u),y(LAM*Math.exp(-2*u))])}
  s+=PATH(pts,'var(--accent)',3);
  const top=y(LAM);
  if(k>=2){const p=now(2);s+=DOT(cx(0),top,6*p,'var(--accent)');s+=TX(cx(0)+13,top-3,`ln 20 ≈ ${f3(Math.log(20))}`,{f:'var(--accent)',w:600,o:p,c:'num',s:15})}
  if(k>=3){const p=now(3),a=1.75,b=2.75,ya=y(LAM*Math.exp(-2*a)),yb=y(LAM*Math.exp(-2*b));
    s+=`<path d="M${cx(a).toFixed(1)},${ya.toFixed(1)} H${cx(b).toFixed(1)} V${yb.toFixed(1)}" fill="none" stroke="var(--accent)" stroke-width="2" opacity="${p}"/>`;
    s+=TX((cx(a)+cx(b))/2+18,ya-8,'1 across',{a:'middle',s:15,o:p,f:'var(--accent)',w:600})+TX(cx(b)-8,(ya+yb)/2+5,'2 down',{a:'end',s:15,o:p,f:'var(--accent)',w:600})}
  if(k>=5){const p=now(5);s+=LN(cx(0)+1,top,cx(0)+1,lerp(top,one,p),'var(--ts)',4);s+=TX(cx(0)+11,(top+one)/2+22,`drop ${f3(Math.log(20))}`,{f:'var(--ts)',w:600,o:p,c:'num',s:15})}
  if(k>=6){const p=now(6),X=cx(T0);s+=LN(cx(0),one+12,lerp(cx(0),X,p),one+12,'var(--ts)',4);s+=TX((cx(0)+X)/2,one+36,`${f3(Math.log(20))} ÷ 2`,{a:'middle',f:'var(--ts)',w:600,o:p,c:'num',s:15})}
  if(k>=7){const p=now(7),X=cx(T0);s+=DOT(X,one,8*p,'var(--ts)');s+=TX(X+12,one-13,`${TSV} ≈ ${f3(T0)}`,{f:'var(--ts)',w:600,s:18,o:p})}
  setFig(s);
}

/* Frame 5: cloned trajectories. */
const FX=t=>58+(3-t)/3*(578-58);
const pQ=i=>D.parent[i]/20, parentEndPlus=()=>pQ(30)>0;
function fanOf(g){return D.fans[g.toFixed(1)]}
function others(g){const fan=fanOf(g);return parentEndPlus()?16-fan.plus:fan.plus}
function drawClones(){
  const k=stepK(),now=nowf(k),g=Math.round(S.split*10)/10,two=k>=3;
  const top=14,bot=two?272:410,yQ=q=>top+(7.4-clamp(q,-7.4,7.4))/14.8*(bot-top),A=Math.sqrt(M2);let s='';
  s+=`<rect x="58" y="${yQ(A+1).toFixed(1)}" width="520" height="${(yQ(A-1)-yQ(A+1)).toFixed(1)}" fill="var(--a)" opacity=".1"/>`;
  s+=`<rect x="58" y="${yQ(-A+1).toFixed(1)}" width="520" height="${(yQ(-A-1)-yQ(-A+1)).toFixed(1)}" fill="var(--b)" opacity=".12"/>`;
  s+=LN(58,yQ(0),578,yQ(0),'var(--rule)',1);
  s+=LN(FX(T0),top,FX(T0),bot,'var(--ts)',2,'6 4');
  s+=TX(64,top+15,'position along the main line',{c:'ax',s:15,f:'var(--muted)'});
  s+=TX(FX(T0)+7,top+17,`${TSV} ≈ ${f3(T0)}`,{f:'var(--ts)',w:600,s:16});
  const prog=k===0?now(0):1,lastP=Math.floor(30*prog);
  const pPts=[];for(let i=0;i<=lastP;i++){const t=3-i*.1;if(k>=1&&t<g-1e-6)break;pPts.push([FX(t),yQ(pQ(i))])}
  if(k>=1){
    const fan=fanOf(g),rev=k===3?1:now(k);
    fan.p.forEach(path=>{const end=path[path.length-1]>0,pts=[];const n=Math.max(1,Math.ceil((path.length-1)*rev));
      for(let j=0;j<=n&&j<path.length;j++)pts.push([FX(g-j*.1),yQ(path[j]/20)]);
      s+=PATH(pts,end?'var(--a)':'var(--b)',1.5,.72)});
    const other=others(g),same=16-other,plus=fan.plus,minus=16-plus;
    s+=TX(572,yQ(A+1)-6,`${plus} of 16 end in class +m`,{a:'end',f:'var(--a)',w:600,s:15,o:rev});
    s+=TX(572,yQ(-A-1)+19,`${minus} of 16 end in class −m`,{a:'end',f:'var(--b)',w:600,s:15,o:rev});
  }else{
    s+=TX(572,yQ(A+1)-6,'class at +m',{a:'end',f:'var(--a)',w:600,s:15});
    s+=TX(572,yQ(-A-1)+19,'class at −m',{a:'end',f:'var(--b)',w:600,s:15});
  }
  s+=PATH(pPts,'var(--ink)',3);
  if(k>=1){const i=Math.round((3-g)/.1);s+=DOT(FX(g),yQ(pQ(i)),6,'var(--ink)');
    s+=TX(clamp(FX(g),92,530),bot-7,`copied at t = ${g.toFixed(1)}`,{a:'middle',w:600,s:15})}
  const ay=two?452:446;
  s+=LN(58,two?438:bot+3,578,two?438:bot+3,'var(--muted)',1.2);
  for(const t of [3,2,1,0]){s+=TX(FX(t),(two?438:bot+3)+18,t,{a:'middle',c:'num',s:14,f:'var(--muted)'})}
  if(!two)s+=TX(318,ay+14,'t, counted down while sampling →',{a:'middle',c:'ax',s:17,f:'var(--muted)'});
    if(two){
    const y0=430,y1=292,yP=p=>y0-(p-.5)/.5*(y0-y1);
    s+=TX(50,yP(.5)+4,'.5',{a:'end',c:'num',s:14,f:'var(--muted)'})+TX(50,yP(1)+5,'1',{a:'end',c:'num',s:14,f:'var(--muted)'});
    s+=LN(58,y1,58,y0,'var(--muted)',1.2);
    s+=LN(FX(T0),y1,FX(T0),y0,'var(--ts)',2,'6 4');
    s+=PATH(D.exact.map(e=>[FX(e[0]),yP(e[1])]),'var(--accent)',2.5);
    for(const c of D.curve)s+=DOT(FX(c[0]),yP(c[1]),2.4,'var(--ok)');
    s+=TX(68,y1+15,'chance two copies agree',{c:'ax',s:17,f:'var(--muted)'})+TX(572,y0-7,'dots simulated, line Equation 6',{a:'end',s:14,f:'var(--muted)'});
    const hit=D.curve.find(c=>Math.abs(c[0]-g)<.01);
    s+=LN(FX(g),top,FX(g),y0,'var(--ink)',1,'3 3')+DOT(FX(g),yP(hit[1]),6,'var(--ink)');
    const right=FX(g)>440;
    s+=TX(FX(g)+(right?-10:10),yP(hit[1])+(right?20:-9),`${(hit[1]*100).toFixed(0)}%`,{a:right?'end':'start',c:'num',w:500,s:16});
  }
  setFig(s);
}

/* Frame 6: T_s against the spread. */
const LX=l=>70+l/1000*(575-70),LY=v=>424-v/4*(424-24);
function drawSlider(){
  const k=stepK(),now=nowf(k),l=val('lam'),T=Ts(l);let s='';
  s+=LN(70,424,575,424,'var(--muted)',1.2)+LN(70,24,70,424,'var(--muted)',1.2);
  for(const v of [0,1,2,3,4])s+=TX(62,LY(v)+5,v,{a:'end',c:'num',s:14,f:'var(--muted)'});
  for(const v of [0,250,500,750,1000])s+=LN(LX(v),424,LX(v),429,'var(--muted)',1.2)+TX(LX(v),445,v,{a:'middle',c:'num',s:14,f:'var(--muted)'});
  s+=`<text x="322" y="465" text-anchor="middle" class="ax" font-size="17" fill="var(--muted)">spread of the data, ${LM}</text>`;
  s+=`<text x="78" y="32" class="ax" font-size="17" fill="var(--muted)">commitment time, ${TSV}</text>`;
  const pts=[];for(let i=0;i<=240;i++){const v=1+Math.pow(i/240,2.4)*999;pts.push([LX(v),LY(Ts(v))])}
  s+=PATH(pts,'var(--accent)',3);
  const marks=[[20,'20'],[40,'40'],[200,'200']];
  marks.slice(0,Math.min(k+1,3)).forEach(m=>{s+=DOT(LX(m[0]),LY(Ts(m[0])),4,'var(--muted)')});
  s+=LN(LX(l),424,LX(l),LY(T),'var(--ink)',1,'3 3')+LN(70,LY(T),LX(l),LY(T),'var(--ink)',1,'3 3')+DOT(LX(l),LY(T),8,'var(--ts)');
  const right=LX(l)>400;
  s+=TX(92,414,`starts at ${LM} = 1, ${TSV} = 0`,{s:14,f:'var(--muted)'});
  s+=TX(LX(l)+(right?-13:13),LY(T)+(right||l<6?-13:24),`${LM} = ${l>=100?Math.round(l):f2(l).replace(/\.00$/,'')}: ${TSV} ≈ ${f3(T)}`,{a:right?'end':'start',f:'var(--ts)',w:600,s:17});
  setFig(s);
}

    for(const p of D.sameA)s+=DOT(X+p[0]*sc,Y-p[1]*sc,3,'var(--a)',.7);

    s+=`<circle cx="${X}" cy="${Y}" r="${(2*Math.sqrt(.7)*sc).toFixed(1)}" fill="none" stroke="var(--a)" stroke-width="2"/><circle cx="${X}" cy="${Y}" r="${(2*Math.sqrt(1.3)*sc).toFixed(1)}" fill="none" stroke="var(--b)" stroke-width="2"/>`;
    s+=DOT(X,Y,6,'var(--ink)');
    s+=TX(X,Y-11,'one shared mean',{a:'middle',w:600});

    s+=LN(70,424,575,424,'var(--muted)',1.2)+LN(70,24,70,424,'var(--muted)',1.2);
    for(const n of [1,2,3,4,5,6])s+=LN(X(n),424,X(n),429,'var(--muted)',1.2)+TX(X(n),445,'10'+'⁰¹²³⁴⁵⁶'[n],{a:'middle',c:'num',s:14,f:'var(--muted)'});
    for(const v of [0,2,4,6])s+=TX(62,Y(v)+5,v,{a:'end',c:'num',s:14,f:'var(--muted)'});
    s+=TX(322,465,'N, the dimension of the data (log scale)',{a:'middle',c:'ax',s:17,f:'var(--muted)'});
    s+=TX(78,32,'leading term of the time',{c:'ax',s:17,f:'var(--muted)'});
    const line=c=>{const r=[];for(let i=0;i<=60;i++){const n=1+i/60*5*p;r.push([X(n),Y(c*Math.log(Math.pow(10,n)))])}return r};
    s+=PATH(line(.5),'var(--accent)',3)+PATH(line(.25),'var(--ts)',3);
    s+=TX(X(4.55),Y(.5*Math.log(Math.pow(10,4.55)))-16,'separated means: ½ log N',{a:'end',f:'var(--accent)',w:600,o:p});
    s+=TX(X(6),Y(1.1),'same mean, different variances: ¼ log N',{a:'end',f:'var(--ts)',w:600,o:p});
  }
  setFig(s);
}

const TOTAL=FRAMES.reduce((a,f)=>a+f.steps.length,0);

function syncCtl(f){
  const c=f.ctl,on=c&&stepK()>=c.from;$('ctl').hidden=!on;if(!on)return;
  const r=$('rng');r.min=c.min;r.max=c.max;r.step=c.step;$('rngL').textContent=c.label;
  const v=S[c.key];r.value=c.fromS?c.fromS(v):v;$('rngV').textContent=c.show(v);
}
function drawF(){
  const f=FRAMES[FI[tab]],k=stepK();
  $('eq').innerHTML=f.eq(k);$('cap').innerHTML=f.cap[k];$('status').textContent=f.status?f.status(k):'';
  syncCtl(f);f.draw();
  $('fig').setAttribute('aria-label',$('title').textContent+'. '+$('cap').textContent);
  let n=k+1;for(let i=0;i<FI[tab];i++)n+=FRAMES[i].steps.length;
  $('fnum').textContent=`${n} / ${TOTAL}`;
}
function buildFrame(){
  const f=FRAMES[FI[tab]];
  if(typeof cancelAnimationFrame==='function')cancelAnimationFrame(animRaf);AP=1;TW=null;settle(f);
  $('title').innerHTML=f.title;$('moreBody').innerHTML=f.more;$('more').open=false;
  subBar(f);drawF();
  [...$('nav').children].forEach((b,i)=>b.setAttribute('aria-current',i===FI[tab]?'true':'false'));
  if(location.hash!=='#'+f.id){try{history.replaceState(null,'','#'+f.id)}catch(e){}}
}
$('nav').innerHTML=FRAMES.map((f,i)=>`<button data-i="${i}">${i+1} ${f.nav}</button>`).join('');
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;FI[tab]=+b.dataset.i;SUB[subKey()]=0;buildFrame()});
$('sPrev').onclick=goPrev;$('sNext').onclick=goNext;
$('rng').addEventListener('input',e=>{
  const f=FRAMES[FI[tab]],c=f.ctl;if(!c)return;
  if(typeof cancelAnimationFrame==='function')cancelAnimationFrame(animRaf);AP=1;TW=null;
  S[c.key]=c.toS?c.toS(e.target.value):+e.target.value;
  $('rngV').textContent=c.show(S[c.key]);$('status').textContent=f.status(stepK());f.draw();
});
document.addEventListener('keydown',e=>{
  if((e.target.tagName&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)))return;
  if(e.key==='ArrowRight'){e.preventDefault();goNext()}
  if(e.key==='ArrowLeft'){e.preventDefault();goPrev()}
});
function fromHash(){const id=location.hash.slice(1),i=FRAMES.findIndex(f=>f.id===id);
  if(i>=0&&i!==FI[tab]){FI[tab]=i;SUB[subKey()]=0;buildFrame()}}
window.addEventListener('hashchange',fromHash);
const start=FRAMES.findIndex(f=>f.id===location.hash.slice(1));if(start>=0)FI[tab]=start;
buildFrame();
})();
