<style>
/* One picture stays in place: a strip of 8 canvas positions, with the walk controls under it. */
:root{
  --bg:#ffffff;--panel:#ffffff;--soft:#f2f4f8;--ink:#1b2130;--muted:#596273;--rule:#d9dde6;
  --A:#2458d6;--B:#b7791f;--J:#7c3aed;--off:#b42318;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c;--panel:#191d27;--soft:#222735;--ink:#e9ebf1;--muted:#a3abba;--rule:#343a49;
  --A:#82a8ff;--B:#f0b351;--J:#b799ff;--off:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c;--panel:#191d27;--soft:#222735;--ink:#e9ebf1;--muted:#a3abba;--rule:#343a49;
  --A:#82a8ff;--B:#f0b351;--J:#b799ff;--off:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.eyebrow{margin:0;font-size:13px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(25px,3.6vw,34px);line-height:1.12;margin:0;text-wrap:balance}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.stage.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:860px){.stage.split{grid-template-columns:minmax(0,1fr)}}
.fig{min-width:0;max-width:880px}
.fig svg{display:block;width:100%;height:auto}
.work{min-width:0;display:grid;gap:9px;font-size:15px}
.work[hidden]{display:none!important}
.mstep{display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 6px}
.mstep b{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:14px}
.mstep p{margin:0;color:var(--muted);font-size:14px;line-height:1.35}
.mstep .eq{grid-column:2;overflow-x:auto;overflow-y:hidden;padding:2px 0;font-size:17px}
.mstep .eq.row{display:flex;flex-wrap:wrap;gap:2px 16px;overflow:visible}
.mstep .eq.row math{display:inline-block}
.chartbox{min-width:0}
math{font-size:1.02em}
.controls{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:end;min-height:58px}
.controls label{display:grid;gap:2px;font-size:14px;color:var(--muted);flex:1 1 230px;max-width:360px}
.controls output{color:var(--ink);font-family:var(--mono);font-weight:500}
input[type=range]{width:100%;accent-color:var(--J);min-height:30px}
.tog{display:inline-flex;border:1.5px solid var(--rule);border-radius:9px;overflow:hidden}
.tog button{font:inherit;font-size:14px;border:0;background:var(--panel);color:var(--muted);padding:7px 12px;min-height:40px;cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.cap{margin:0;min-height:78px;max-width:70ch;font-size:17px}
nav{display:flex;align-items:center;gap:10px}
nav button.go{font:inherit;font-size:15px;min-height:42px;padding:0 17px;border-radius:9px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
nav button.go.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button.go:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:2px;flex:1;justify-content:center;align-items:center}
.dots button{width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots button[aria-current="true"]::before{background:var(--ink)}
#fnum{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
:focus-visible{outline:2px solid var(--J);outline-offset:2px}
details{border-top:1px solid var(--rule);padding-top:8px;font-size:15px;color:var(--muted)}
summary{cursor:pointer;font-weight:500}
details ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;max-width:82ch}
details b{color:var(--ink);font-weight:600}
/* figure text */
svg text{font-family:var(--body);font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
svg text.val{font-family:var(--mono);font-size:12.5px;font-weight:500;stroke-width:0}
svg text.pos,svg text.tick{fill:var(--muted);font-size:11.5px}
svg text.lab{font-weight:600}
svg text.a{fill:var(--A)} svg text.b{fill:var(--B)} svg text.j{fill:var(--J)} svg text.off{fill:var(--off)}
svg text.big{font-family:var(--display);font-size:16px;font-weight:700}
svg text.note{fill:var(--muted);font-size:12px}
.cell{stroke-width:1.5}
.cell.a{stroke:var(--A)} .cell.b{stroke:var(--B)} .cell.j{stroke:var(--J)} .cell.x{stroke:var(--rule)} .cell.gap{stroke:var(--ink);stroke-dasharray:3 3}
.empty{fill:none;stroke:var(--rule);stroke-dasharray:2 4}
.band{fill:var(--soft);stroke:var(--J);stroke-width:1.5;stroke-dasharray:5 4}
.focus{fill:none;stroke:var(--J);stroke-width:2.5}
.dim{opacity:.38}
.grid{stroke:var(--rule);stroke-width:1}
.line-a{stroke:var(--A);fill:none;stroke-width:2}.line-b{stroke:var(--B);fill:none;stroke-width:2}
.line-on{stroke:var(--J);fill:none;stroke-width:3}.line-off{stroke:var(--off);fill:none;stroke-width:3}
.faint{opacity:.42}
.pt-on{fill:var(--J)}.pt-off{fill:var(--off)}
.box{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.box.a{stroke:var(--A)}.box.b{stroke:var(--B)}.box.j{stroke:var(--J);stroke-width:2.5}
.box.c{fill:var(--soft);stroke:var(--ink);stroke-width:2}
.wire{fill:none;stroke:var(--muted);stroke-width:1.6}
.tile{fill:var(--soft);stroke:var(--rule)}
.shape-a{fill:var(--A)}.shape-b{fill:var(--B)}.ring{fill:none;stroke:var(--ink);stroke-width:2}
.card{fill:none;stroke:var(--rule)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main class="wrap">
  <p class="eyebrow">Reading 7: composing by regions. Toy numbers are invented and illustrative.</p>
  <h1 id="ttl"></h1>
  <section class="stage" id="stage">
    <div class="fig" id="fig"></div>
    <aside class="work" id="work" hidden></aside>
  </section>
  <div class="controls" id="ctrl" data-optional></div>
  <p class="cap" id="cap"></p>
  <nav aria-label="Frames">
    <button class="go" id="prev" type="button">Back</button>
    <div class="dots" id="dots"></div>
    <span id="fnum"></span>
    <button class="go primary" id="next" type="button">Next</button>
  </nav>
  <details id="src"><summary>Sources and caveats for this frame</summary><ul id="srcbody"></ul></details>
</main>

<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('toy').textContent);
const $=id=>document.getElementById(id);
const S={f:0,k:2,wi:2,t:0,rec:true,coord:true};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const T=(x,y,s,c='',a='start')=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="${c}" text-anchor="${a}">${esc(s)}</text>`;
const R=(x,y,w,h,c='',st='',rx=5)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx}" class="${c}" style="${st}"/>`;
const P=(d,c)=>`<path d="${d}" class="${c}"/>`;
const C=(x,y,r,c)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" class="${c}"/>`;
const svg=(W,H,body,label)=>`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${body}</svg>`;
const figW=()=>Math.max(320,Math.min(880,$('fig').clientWidth||720));
const tint=(v,c)=>`fill:color-mix(in srgb,var(--${c}) ${Math.round(12+Number(v)*5)}%,var(--panel))`;

/* The strip: one column per canvas position, one row per thing holding values. */
function strip(W,top,rows,o={}){
  const lab=W<520?60:112,cw=Math.min(76,(W-lab-3)/8),ch=Math.min(42,Math.max(32,cw*.8)),gap=7;
  const cx=i=>lab+cw*(i+.5);let out='';
  const shared=o.shared||[];
  const h=rows.length*(ch+gap)-gap;
  if(shared.length) out+=R(lab+cw*shared[0]-2,top+15,cw*shared.length+4,h+10,'band');
  for(let i=0;i<8;i++) out+=T(cx(i),top+11,i,'pos','middle');
  rows.forEach((r,ri)=>{
    const y=top+20+ri*(ch+gap);
    out+=T(lab-8,y+ch/2+4,W<520?r.short:r.label,'lab '+r.c,'end');
    r.vals.forEach((v,i)=>{
      const x=lab+cw*i+2,w=cw-4;
      if(v==null){ if(!r.bare) out+=R(x,y,w,ch,'empty'); return; }
      const dim=o.dimOutside&&!shared.includes(i)?' dim':'';
      const fresh=r.fresh?' new':'';
      out+=`<g class="${(dim+fresh).trim()}">`+R(x,y,w,ch,'cell '+r.c,r.c==='gap'?'fill:none':tint(v,r.c==='x'?'muted':r.c.toUpperCase()))+T(x+w/2,y+ch/2+4.5,v,'val','middle')+'</g>';
    });
    if(o.focus!=null&&r.focus) out+=R(lab+cw*o.focus,y-2,cw,ch+4,'focus');
  });
  return {svg:out,bottom:top+20+h,cx,cw,lab};
}

/* Frames 1 and 2 */
const base=()=>D.cases['2_2'];
function f1(W){
  const c=base();
  const s=strip(W,4,[
    {label:'noisy canvas',short:'noisy',c:'x',vals:D.x0},
    {label:'window A',short:'A',c:'a',vals:c.a,fresh:true},
    {label:'window B',short:'B',c:'b',vals:c.b,fresh:true}]);
  return svg(W,s.bottom+8,s.svg,'A noisy canvas of 8 positions, with window A holding its result at positions 0 to 4 and window B at positions 3 to 7');
}
function f2(W){
  const c=base();
  const g=c.gaps;
  const s=strip(W,4,[
    {label:'window A',short:'A',c:'a',vals:c.a},
    {label:'window B',short:'B',c:'b',vals:c.b},
    {label:'B minus A',short:'B − A',c:'gap',vals:g,bare:true,fresh:true}],{shared:c.shared,dimOutside:true});
  return svg(W,s.bottom+10,s.svg,'At positions 3 and 4 both windows hold values, and B is 2.4 above A at each');
}

/* Frame 3: the worked reconcile */
const mn=x=>`<mn>${x}</mn>`,mi=x=>`<mi>${x}</mi>`,mo=x=>`<mo>${x}</mo>`;
const lp='<mo stretchy="false" lspace="0" rspace="0">(</mo>',rp='<mo stretchy="false" lspace="0" rspace="0">)</mo>';
const sq=(a)=>`<msup><mrow>${lp}${mi('J')}${mo('−')}${mn(a)}${rp}</mrow>${mn(2)}</msup>`;
const lin=(a)=>`<mrow>${lp}${mi('J')}${mo('−')}${mn(a)}${rp}</mrow>`;
const Cat=(v,r)=>`<math><mrow>${mi('C')}${lp}${mn(v)}${rp}${mo('=')}${r}</mrow></math>`;
const M=b=>`<math display="block"><mrow>${b}</mrow></math>`;
function work3(c){
  const steps=[
    ['Score a candidate J by its weighted squared miss from each window.',
      M(`${mi('C')}${lp}${mi('J')}${rp}${mo('=')}${mn(1)}${sq(c.va)}${mo('+')}${mn(c.w)}${sq(c.vb)}`)],
    ['The best J is where the slope of that score is zero.',
      M(`${mn(2)}${lin(c.va)}${mo('+')}${mn(2)}${mo('·')}${mn(c.w)}${lin(c.vb)}${mo('=')}${mn(0)}`)],
    ['Solve for J. It is the weighted average.',
      M(`${mi('J')}${mo('=')}<mfrac><mrow>${mn(c.va)}${mo('+')}${mn(c.w)}${mo('·')}${mn(c.vb)}</mrow><mrow>${mn(1)}${mo('+')}${mn(c.w)}</mrow></mfrac>${mo('=')}<mfrac>${mn(c.sum)}${mn(c.den)}</mfrac>${mo('=')}<mn mathvariant="bold">${c.vJ}</mn>`)],
    ['Check: the score at J is lowest.',
      null,[Cat(c.vJ,`<mn mathvariant="bold">${c.costJ}</mn>`),Cat(c.va,mn(c.costA)),Cat(c.vb,mn(c.costB))].join('')]
  ];
  return steps.map((s,i)=>`<div class="mstep"><b>${i+1}</b><p>${s[0]}</p><div class="eq${s[1]?'':' row'}">${s[1]||s[2]}</div></div>`).join('');
}
function f3(W){
  const c=D.cases[`${S.k}_${S.wi}`];
  const s=strip(W,4,[
    {label:'window A',short:'A',c:'a',vals:c.a},
    {label:'window B',short:'B',c:'b',vals:c.b},
    {label:'reconciled',short:'kept',c:'j',vals:c.J,fresh:true,focus:true}],{shared:c.shared,focus:c.p});
  return svg(W,s.bottom+10,s.svg,`Reconciled canvas with the worked value ${c.vJ} at position ${c.p}`);
}

/* Frame 4: repeat at every noise level */
function f4(W){
  const w=D.walk,on=w.on[S.t],off=w.off[S.t];
  const rows=S.rec?[
    {label:'window A',short:'A',c:'a',vals:on.a},
    {label:'window B',short:'B',c:'b',vals:on.b},
    {label:'reconciled',short:'kept',c:'j',vals:on.J}]:[
    {label:'run A alone',short:'A',c:'a',vals:off.a},
    {label:'run B alone',short:'B',c:'b',vals:off.b}];
  const s=strip(W,2,rows,{shared:w.shared});
  return svg(W,s.bottom+8,s.svg,`Windows at noise step ${S.t+1} of 5`);
}
function chart4(){
  const w=D.walk,W=Math.max(320,Math.min(560,$('work').clientWidth||420));
  const top=26,ph=W<420?150:176,l=34,r=W-12,yv=v=>top+ph-((v+.45)/4.95)*ph,xs=i=>l+24+(r-l-52)*i/4;
  let o=T(4,14,'gap between A and B at position 3','lab');
  [0,1,2,3,4].forEach(v=>{o+=`<line x1="${l}" x2="${r}" y1="${yv(v).toFixed(1)}" y2="${yv(v).toFixed(1)}" class="grid"/>`+T(l-7,yv(v)+4,v,'tick','end');});
  const path=a=>a.map((d,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+yv(d.gapValue).toFixed(1)).join(' ');
  o+=P(path(w.off),'line-off'+(S.rec?' faint':''))+P(path(w.on),'line-on'+(S.rec?'':' faint'));
  const act=S.rec?w.on:w.off;
  act.forEach((d,i)=>{o+=T(xs(i),yv(d.gapValue)+(S.rec?19:-9),d.gap,'val '+(S.rec?'j':'off'),'middle');});
  o+=C(xs(S.t),yv(act[S.t].gapValue),6,S.rec?'pt-on':'pt-off');
  o+=T(xs(4)+14,yv(S.rec?3.0:2.86),'never reconciled','lab off','end');
  o+=T(xs(4)+14,yv(S.rec?1.25:1.02),'reconciled every step','lab j','end');
  w.on.forEach((d,i)=>{o+=T(xs(i),top+ph+15,i%2===0||W>=470?d.from:'','tick','middle');});
  o+=T(xs(4)+14,top+ph+15,'','tick','end');
  o+=T((l+r)/2,top+ph+33,'noise level σ at the start of each step','note','middle');
  return `<div class="chartbox">${svg(W,top+ph+40,o,'Gap between the windows at position 3 across five noise steps, falling when reconciled and growing when never reconciled')}</div>`;
}

/* Frame 5: what the coordinator adds */
function f5(W){
  const c=base(),H=262,on=S.coord,bw=Math.max(66,W*.135),gapx=(W-bw*4-4)/3,col=i=>2+i*(bw+gapx);
  const ya=38,yb=148,bh=62,mid=y=>y+bh/2;let o='';
  const dim=on?'':'dim';
  o+=T(col(0)+bw/2,18,W<520?'outputs':'window outputs','note','middle');
  o+=`<g class="${dim}">`+T(col(1)+bw/2,18,'coordinator','note','middle')+T(col(2)+bw/2,18,W<520?'new':'new outputs','note','middle')+'</g>';
  o+=T(col(3)+bw/2,18,'overlap','note','middle');
  const box=(x,y,cl,l1,l2)=>R(x,y,bw,bh,'box '+cl)+T(x+bw/2,y+25,l1,'lab '+(cl==='c'?'':cl),'middle')+(l2?T(x+bw/2,y+45,l2,'val','middle'):'');
  o+=box(col(0),ya,'a','A',c.va)+box(col(0),yb,'b','B',c.vb);
  if(on){
    o+=P(`M${col(0)+bw} ${mid(ya)} H${col(1)}`,'wire')+P(`M${col(0)+bw} ${mid(yb)} H${col(1)}`,'wire');
    o+='<g class="new">'+R(col(1),ya,bw,yb+bh-ya,'box c')+T(col(1)+bw/2,(ya+yb+bh)/2-5,'trained','lab','middle')+T(col(1)+bw/2,(ya+yb+bh)/2+13,'network','lab','middle')+'</g>';
    o+=P(`M${col(1)+bw} ${mid(ya)} H${col(2)}`,'wire')+P(`M${col(1)+bw} ${mid(yb)} H${col(2)}`,'wire');
    o+='<g class="new">'+box(col(2),ya,'a','new A','')+box(col(2),yb,'b','new B','')+'</g>';
    o+=P(`M${col(2)+bw} ${mid(ya)} C${col(3)-gapx/2} ${mid(ya)} ${col(3)-gapx/2} ${(ya+yb+bh)/2} ${col(3)} ${(ya+yb+bh)/2}`,'wire');
    o+=P(`M${col(2)+bw} ${mid(yb)} C${col(3)-gapx/2} ${mid(yb)} ${col(3)-gapx/2} ${(ya+yb+bh)/2} ${col(3)} ${(ya+yb+bh)/2}`,'wire');
  } else {
    o+=P(`M${col(0)+bw} ${mid(ya)} C${col(2)} ${mid(ya)} ${col(2)} ${(ya+yb+bh)/2} ${col(3)} ${(ya+yb+bh)/2}`,'wire');
    o+=P(`M${col(0)+bw} ${mid(yb)} C${col(2)} ${mid(yb)} ${col(2)} ${(ya+yb+bh)/2} ${col(3)} ${(ya+yb+bh)/2}`,'wire');
  }
  const ay=(ya+yb+bh)/2-40;
  o+=R(col(3),ay,bw,80,'box j')+T(col(3)+bw/2,ay+30,'average','lab j','middle')+T(col(3)+bw/2,ay+54,on?'new A, B':c.vJ,on?'note':'val','middle');
  return svg(W,H-30,o,on?'Window outputs pass through a trained network into new outputs, which are then averaged in the overlap':'Window outputs go straight into the average in the overlap');
}

/* Frame 6: what data each method saw */
function tiles(x,y,kind,size){
  let o='';const n=3,g=6;
  for(let i=0;i<n;i++){
    const tx=x+i*(size+g);o+=R(tx,y,size,size,'tile','',3);
    const m=tx+size/2,q=size/4;
    if(kind==='?') o+=T(m,y+size/2+5,'?','big','middle');
    if(kind==='clevr'){
      const pts=[[[-1,-.6],[.9,.7]],[[.8,-.8],[-.9,.5],[.3,.9]],[[-.2,-.9],[1,.2]]][i];
      pts.forEach(([a,b],j)=>{o+=C(m+a*q,y+size/2+b*q,4.2,j?'shape-b':'shape-a');});
      const r=pts[0];o+=C(m+r[0]*q,y+size/2+r[1]*q,7.5,'ring');
    }
    if(kind==='a') o+=C(m,y+size/2,q*.9,'shape-a');
    if(kind==='b') o+=R(m-q*.8,y+size/2-q*.8,q*1.6,q*1.6,'shape-b','',2);
  }
  return o;
}
function f6(W){
  const wide=W>=660,cw=wide?(W-24)/3:W-2,ch=wide?206:172;let o='';
  const cards=[
    {t:'MultiDiffusion',k:'?',lines:['one pre-trained model','training data not on','these pages']},
    {t:'Domain Expansion',k:'clevr',lines:['one base model, 30,000 CLEVR','images, one labelled object each','coordinator: up to 2 labelled','positions per image']},
    {t:'Paper 1',k:'split',lines:['two models, disjoint data','no real joint images allowed']}
  ];
  cards.forEach((c,i)=>{
    const x=wide?1+i*(cw+11):1,y=wide?1:1+i*(ch+10),size=wide?Math.min(52,(cw-44)/3):46;
    o+=R(x,y,cw,ch,'card','',8)+T(x+14,y+26,c.t,'big');
    const ty=y+42,tx=x+14;
    if(c.k==='split'){
      const s=wide?Math.min(32,(cw-58)/6):34;
      o+=tiles(tx,ty,'a',s);o+=`<line x1="${tx+3*s+15}" x2="${tx+3*s+15}" y1="${ty-3}" y2="${ty+s+3}" class="wire"/>`+tiles(tx+3*s+30,ty,'b',s);
    } else o+=tiles(tx,ty,c.k,size);
    const ly=wide?y+126:y+108;
    c.lines.forEach((l,j)=>{o+=T(x+14,ly+j*19,l,'');});
  });
  const H=wide?ch+3:cards.length*(ch+10);
  return svg(W,H,o,'Three cards: MultiDiffusion training data not stated, Domain Expansion CLEVR images with one labelled object each, Paper 1 two models on disjoint data');
}

/* Controls */
function ctrl(){
  const box=$('ctrl');
  if(S.f===2){
    box.innerHTML=`<label for="ovl">Positions the windows share: <output id="ovlO">${S.k}</output><input id="ovl" type="range" min="1" max="4" step="1" value="${S.k}"></label>
    <label for="wgt">Window B's weight, with A held at 1: <output id="wgtO">${D.weights[S.wi]}</output><input id="wgt" type="range" min="0" max="5" step="1" value="${S.wi}"></label>`;
    $('ovl').oninput=e=>{S.k=+e.target.value;$('ovlO').textContent=S.k;paint(false);};
    $('wgt').oninput=e=>{S.wi=+e.target.value;$('wgtO').textContent=D.weights[S.wi];paint(false);};
  } else if(S.f===3){
    const r=D.walk.on[S.t];
    box.innerHTML=`<label for="noi">Noise level: <output id="noiO">${S.t+1} of 5, σ ${r.from} → ${r.to}</output><input id="noi" type="range" min="0" max="4" step="1" value="${S.t}"></label>
    <div class="tog" role="group" aria-label="Reconcile setting"><button type="button" id="recOn" aria-pressed="${S.rec}">Reconcile on</button><button type="button" id="recOff" aria-pressed="${!S.rec}">Reconcile off</button></div>`;
    $('noi').oninput=e=>{S.t=+e.target.value;const q=D.walk.on[S.t];$('noiO').textContent=`${S.t+1} of 5, σ ${q.from} → ${q.to}`;paint(false);};
    $('recOn').onclick=()=>{S.rec=true;ctrl();paint(false);$('recOn').focus();};
    $('recOff').onclick=()=>{S.rec=false;ctrl();paint(false);$('recOff').focus();};
  } else if(S.f===4){
    box.innerHTML=`<div class="tog" role="group" aria-label="Method"><button type="button" id="cOff" aria-pressed="${!S.coord}">MultiDiffusion</button><button type="button" id="cOn" aria-pressed="${S.coord}">Domain Expansion</button></div>`;
    $('cOff').onclick=()=>{S.coord=false;ctrl();paint(true);$('cOff').focus();};
    $('cOn').onclick=()=>{S.coord=true;ctrl();paint(true);$('cOn').focus();};
  } else box.innerHTML='';
  box.style.display=box.innerHTML?'':'none';
}

function paint(changed){
  const fr=FR[S.f];
  $('ttl').textContent=fr.t;
  const work=$('work');
  if(fr.work){work.hidden=false;$('stage').classList.add('split');}
  else{work.hidden=true;work.innerHTML='';$('stage').classList.remove('split');}
  $('fig').innerHTML='';
  if(fr.work) work.innerHTML=fr.work();
  $('fig').innerHTML=fr.draw(figW());
  $('cap').textContent=fr.cap();
  $('srcbody').innerHTML=fr.src().map(s=>`<li>${s}</li>`).join('');
  $('fnum').textContent=`${S.f+1} / ${FR.length}`;
  $('prev').disabled=S.f===0;$('next').disabled=S.f===FR.length-1;
  [...$('dots').children].forEach((b,i)=>b.setAttribute('aria-current',String(i===S.f)));
  let still=false;try{still=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(changed&&!still&&Element.prototype.animate){
    $('fig').querySelectorAll('.new').forEach(n=>n.animate([{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'none'}],{duration:420,easing:'ease-out'}));
  }
}
function go(i,fromHash){
  const n=Math.max(0,Math.min(FR.length-1,i));
  const moved=n!==S.f;S.f=n;ctrl();paint(moved||!fromHash);
  if(!fromHash){try{history.replaceState(null,'','#f'+(n+1));}catch(e){}}
}
FR.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`Frame ${i+1}: ${f.t}`);b.onclick=()=>go(i);$('dots').appendChild(b);});
$('prev').onclick=()=>go(S.f-1);$('next').onclick=()=>go(S.f+1);
addEventListener('keydown',e=>{
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.key==='ArrowRight')go(S.f+1);else if(e.key==='ArrowLeft')go(S.f-1);
});
const fromHash=()=>{const m=/^#f([1-6])$/.exec(location.hash);if(m)go(+m[1]-1,true);};
addEventListener('hashchange',fromHash);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>paint(false),80);});
ctrl();paint(false);fromHash();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>paint(false));
})();
</script>
