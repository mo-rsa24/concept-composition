<text font-family="DejaVu Sans" x="1585.0" y="190.0" font-size="18" fill="#2b3440" font-weight="700" text-anchor="start">What step X4 has to decide for it</text>
<text font-family="DejaVu Sans" x="1585.0" y="235.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">Which x_t the 16 steps read: the sampler&#x27;s</text>
<text font-family="DejaVu Sans" x="1585.0" y="259.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">own path, or a test canvas noised per step.</text>
<text font-family="DejaVu Sans" x="1585.0" y="299.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">Which window: t = 999 to 693, or 712 to 480.</text>
<text font-family="DejaVu Sans" x="1585.0" y="339.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">Raw d_t, or scaled like V2&#x27;s maps (each</text>
<text font-family="DejaVu Sans" x="1585.0" y="363.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">map adds to 2,048).</text>
<text font-family="DejaVu Sans" x="1585.0" y="403.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">Whether it is told the step, as W4 is.</text>
<text font-family="DejaVu Sans" x="1585.0" y="443.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">What a joint path is: the models have no</text>
<text font-family="DejaVu Sans" x="1585.0" y="467.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">pair label, so only product paths exist.</text>
<text font-family="DejaVu Sans" x="1585.0" y="507.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">How it reads 16 steps: as 16 channels, or</text>
<text font-family="DejaVu Sans" x="1585.0" y="531.0" font-size="15" fill="#2b3440" font-weight="400" text-anchor="start">one step at a time, then pooled.</text>
<text font-family="DejaVu Sans" x="1585.0" y="650.0" font-size="14" fill="#5f6b78" font-weight="400" text-anchor="start">These are open in the code as of</text>
<text font-family="DejaVu Sans" x="1585.0" y="672.0" font-size="14" fill="#5f6b78" font-weight="400" text-anchor="start">commit 2dcb2beb; none is answered here.</text>
<text font-family="DejaVu Sans" x="36.0" y="878.0" font-size="14" fill="#5f6b78" font-weight="400" text-anchor="start">Real sizes: numbers.json (CLIP-L text width and caption bank from w4_train.py; W4 widths from Loop 9 design.md). The score-path encoder has no design.</text>
