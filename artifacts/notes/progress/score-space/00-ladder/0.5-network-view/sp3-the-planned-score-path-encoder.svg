<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 900" width="2200" height="900" role="img" aria-label="Three lanes: a caption through the frozen CLIP-L text encoder, a noisy canvas through Loop 9 W4 encoder, and a score path through a planned dashed encoder, each to a strip, beside the questions step X4 must settle." font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
