<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 760px; background-color: white;" viewBox="0 0 760 620" role="graphics-document document" aria-roledescription="quadrantChart"><style>#my-svg{font-family:monospace;font-size:16px;fill:#111111;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#my-svg .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#0b0b0b;stroke:#0b0b0b;}#my-svg .marker.cross{stroke:#0b0b0b;}#my-svg svg{font-family:monospace;font-size:16px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:hsl(40.5882352941, 60%, 83.3333333333%);}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:hsl(40.5882352941, 60%, 83.3333333333%);filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="393" y="45" width="362" height="272" fill="#fff4e6"/><text x="0" y="0" fill="#111111" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(574, 50) rotate(0)">Plan it</text></g><g class="quadrant"><rect x="31" y="45" width="362" height="272" fill="#d3f9d8"/><text x="0" y="0" fill="#0c0c0c" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(212, 50) rotate(0)">Do now</text></g><g class="quadrant"><rect x="31" y="317" width="362" height="272" fill="#f1f3f5"/><text x="0" y="0" fill="#070707" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(212, 322) rotate(0)">Drop or park</text></g><g class="quadrant"><rect x="393" y="317" width="362" height="272" fill="#f8f9fa"/><text x="0" y="0" fill="#020202" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(574, 322) rotate(0)">Only if time</text></g></g><g class="border"><line x1="30" y1="45" x2="756" y2="45" style="stroke: rgb(238, 222, 187); stroke-width: 2;"/><line x1="755" y1="46" x2="755" y2="588" style="stroke: rgb(238, 222, 187); stroke-width: 2;"/><line x1="30" y1="589" x2="756" y2="589" style="stroke: rgb(238, 222, 187); stroke-width: 2;"/><line x1="31" y1="46" x2="31" y2="588" style="stroke: rgb(238, 222, 187); stroke-width: 2;"/><line x1="393" y1="46" x2="393" y2="588" style="stroke: rgb(238, 222, 187); stroke-width: 1;"/><line x1="32" y1="317" x2="754" y2="317" style="stroke: rgb(238, 222, 187); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="610.2" cy="512.84" r="5" fill="#222222" stroke="#222222" stroke-width="0px"/><text x="0" y="0" fill="#111111" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(610.2, 517.84) rotate(0)">Deep-read the other 73</text></g><g class="data-point"><circle cx="248.2" cy="512.84" r="5" fill="#222222" stroke="#222222" stroke-width="0px"/><text x="0" y="0" fill="#111111" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(248.2, 517.84) rotate(0)">Fashion-MNIST</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#111111" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(212, 599) rotate(0)">Little effort</text></g><g class="label"><text x="0" y="0" fill="#111111" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(574, 599) rotate(0)">Big effort</text></g><g class="label"><text x="0" y="0" fill="#111111" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 453) rotate(-90)">Can do without</text></g><g class="label"><text x="0" y="0" fill="#111111" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 181) rotate(-90)">Needed for the outcome</text></g></g><g class="title"><text x="0" y="0" fill="#111111" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(380, 10) rotate(0)">Open steps: need against effort</text></g></g></svg>