<svg class="hld" style="--fs:15.1px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1827 868" width="1827" height="868" role="img" aria-labelledby="hld-t hld-d">
<title id="hld-t">Paper 1 against DCFM: what crosses between data holders, and when</title><desc id="hld-d">Two ways to compose generative models trained on separate data. Read from Loop 4&#x27;s DCFM note, the Paper 1 problem statement and the DCFM attack plan, 2026-11-25.</desc>
<style>
