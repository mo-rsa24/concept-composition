<defs><marker id="hld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1827" height="868"/>
<text class="title" x="32" y="32">Paper 1 against DCFM: what crosses between data holders, and when</text>
<text class="subtitle" x="32" y="52">Two ways to compose generative models trained on separate data. Read from Loop 4&#x27;s DCFM note, the Paper 1 problem statement and the DCFM attack plan, 2026-11-25.</text>
<rect class="group" x="28.2" y="63.0" width="721.0" height="777.0" rx="14"/>
<text class="group-label" x="40.2" y="78.0">DCFM (Morshed and Boddeti, ICML 2026): models cross between silos during training</text>
<rect class="group" x="1078.2" y="63.0" width="721.0" height="777.0" rx="14"/>
<text class="group-label" x="1090.2" y="78.0">PAPER 1: experts that never met; nothing crosses during training</text>
<path class="edge sync" data-edge="d_silos&gt;d_stage1" d="M388.7 185.0 L388.7 256.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="d_stage1&gt;d_a" d="M250.2 298.0 L283.7 298.0 L283.7 458.0 L317.2 458.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="d_stage1&gt;d_b" d="M527.2 298.0 L493.7 298.0 L493.7 458.0 L460.2 458.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="d_a&gt;d_compose" d="M178.7 500.0 L178.7 576.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="d_b&gt;d_student" d="M598.7 500.0 L598.7 576.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="d_compose&gt;d_scored" d="M178.7 660.0 L178.7 694.0 L388.7 694.0 L388.7 728.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="d_student&gt;d_scored" d="M598.7 660.0 L598.7 694.0 L388.7 694.0 L388.7 728.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="p_holders&gt;p_experts" d="M1228.7 185.0 L1228.7 256.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="p_experts&gt;p_checker" d="M1367.2 298.0 L1648.7 298.0 L1648.7 416.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="p_experts&gt;p_sample" d="M1228.7 340.0 L1228.7 568.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="p_checker&gt;p_sample" d="M1648.7 500.0 L1648.7 618.0 L1090.2 618.0" marker-end="url(#hld-arrow)"/>
<path class="edge sync" data-edge="p_sample&gt;p_eval" d="M1228.7 668.0 L1228.7 728.0" marker-end="url(#hld-arrow)"/>
<path class="edge async" data-edge="d_scored&gt;p_eval" d="M527.2 778.0 L1090.2 778.0" marker-end="url(#hld-arrow)"/>
<g class="node" id="n-d_silos" style="--k:var(--k-store)">
<path class="shape" d="M250.2 98.0 A138.5 7 0 0 1 527.2 98.0 V178.0 A138.5 7 0 0 1 250.2 178.0 Z"/>
<path class="rim" d="M250.2 98.0 A138.5 7 0 0 0 527.2 98.0"/>
<text class="eyebrow" x="388.7" y="118.0" text-anchor="middle">data · stays in each silo</text>
<text class="label" x="388.7" y="137.0" text-anchor="middle">n data silos</text>
<text class="sub" x="388.7" y="153.9" text-anchor="middle">10 on Colored MNIST, 4 on chest X-rays,</text>
<text class="sub" x="388.7" y="171.7" text-anchor="middle">2 on robot planning (p6 to p8)</text>
</g>
<g class="node" id="n-d_stage1" style="--k:var(--k-block)">
<rect class="shape" x="250.2" y="256.0" width="277" height="84" rx="10"/>
<text class="eyebrow" x="388.7" y="274.5" text-anchor="middle">training time · Stage I</text>
<text class="label" x="388.7" y="293.5" text-anchor="middle">One flow-matching expert per silo</text>
<text class="sub" x="388.7" y="310.4" text-anchor="middle">trained on its own data, with a local</text>
<text class="sub" x="388.7" y="328.2" text-anchor="middle">independence penalty (p5, Eqs. 8 to 11)</text>
</g>
<g class="node" id="n-d_a" style="--k:var(--k-block)">
<rect class="shape" x="40.2" y="416.0" width="277" height="84" rx="10"/>
<text class="eyebrow" x="178.7" y="434.5" text-anchor="middle">training time · DCFM-A</text>
<text class="label" x="178.7" y="453.5" text-anchor="middle">Retrain every expert</text>
<text class="sub" x="178.7" y="470.4" text-anchor="middle">peers&#x27; experts frozen; global independence</text>
<text class="sub" x="178.7" y="488.2" text-anchor="middle">penalty, CoInD&#x27;s (p5, Eqs. 12 to 14)</text>
</g>
<g class="node" id="n-d_b" style="--k:var(--k-edge)">
<rect class="shape" x="460.2" y="416.0" width="277" height="84" rx="10"/>
<text class="eyebrow" x="598.7" y="434.5" text-anchor="middle">training time · DCFM-B</text>
<text class="label" x="598.7" y="453.5" text-anchor="middle">Distil into one student</text>
<text class="sub" x="598.7" y="470.4" text-anchor="middle">on a trusted server, from samples the</text>
<text class="sub" x="598.7" y="488.2" text-anchor="middle">frozen experts generate (p6, Eqs. 15 to 17)</text>
</g>
<g class="node" id="n-d_compose" style="--k:var(--k-service)">
<rect class="shape" x="40.2" y="576.0" width="277" height="84" rx="10"/>
<text class="eyebrow" x="178.7" y="594.5" text-anchor="middle">sampling time · DCFM-A</text>
<text class="label" x="178.7" y="613.5" text-anchor="middle">Compose the retrained experts</text>
<text class="sub" x="178.7" y="630.4" text-anchor="middle">unconditional velocity plus one</text>
<text class="sub" x="178.7" y="648.2" text-anchor="middle">difference per attribute (p3, Eq. 5)</text>
</g>
<g class="node" id="n-d_student" style="--k:var(--k-service)">
<rect class="shape" x="460.2" y="576.0" width="277" height="84" rx="10"/>
<text class="eyebrow" x="598.7" y="594.5" text-anchor="middle">sampling time · DCFM-B</text>
<text class="label" x="598.7" y="613.5" text-anchor="middle">Sample the one student</text>
<text class="sub" x="598.7" y="630.4" text-anchor="middle">conditioned on the attributes asked for</text>
<text class="sub" x="598.7" y="648.2" text-anchor="middle">(p6, Eq. 15)</text>
</g>
<g class="node" id="n-d_scored" style="--k:var(--k-loss)">
<rect class="shape" x="250.2" y="728.0" width="277" height="100" rx="10"/>
<text class="eyebrow" x="388.7" y="745.6" text-anchor="middle">what DCFM scores</text>
<text class="label" x="388.7" y="764.6" text-anchor="middle">Unseen combinations, scored</text>
<text class="sub" x="388.7" y="781.5" text-anchor="middle">novel FID on Colored MNIST, IID, lower</text>
<text class="sub" x="388.7" y="799.3" text-anchor="middle">is better: DCFM-A 11.41, a finished-expert</text>
<text class="sub" x="388.7" y="817.1" text-anchor="middle">baseline 25.19 (Table 1, p7)</text>
</g>
<g class="node" id="n-p_holders" style="--k:var(--k-store)">
<path class="shape" d="M1090.2 98.0 A138.5 7 0 0 1 1367.2 98.0 V178.0 A138.5 7 0 0 1 1090.2 178.0 Z"/>
<path class="rim" d="M1090.2 98.0 A138.5 7 0 0 0 1367.2 98.0"/>
<text class="eyebrow" x="1228.7" y="118.0" text-anchor="middle">data · stays with each holder</text>
<text class="label" x="1228.7" y="137.0" text-anchor="middle">Two data holders</text>
<text class="sub" x="1228.7" y="153.9" text-anchor="middle">disjoint data: no image or prompt</text>
<text class="sub" x="1228.7" y="171.7" text-anchor="middle">holds both concepts</text>
</g>
<g class="node" id="n-p_experts" style="--k:var(--k-block)">
<rect class="shape" x="1090.2" y="256.0" width="277" height="84" rx="10"/>
<text class="eyebrow" x="1228.7" y="274.5" text-anchor="middle">training time · once</text>
<text class="label" x="1228.7" y="293.5" text-anchor="middle">Two finished experts</text>
<text class="sub" x="1228.7" y="310.4" text-anchor="middle">each trained alone on its own data;</text>
<text class="sub" x="1228.7" y="328.2" text-anchor="middle">never retrained, never exchanged</text>
</g>
<g class="node" id="n-p_checker" style="--k:var(--k-block)">
<rect class="shape" x="1510.2" y="416.0" width="277" height="84" rx="10"/>
<text class="eyebrow" x="1648.7" y="434.5" text-anchor="middle">after the experts finish</text>
<text class="label" x="1648.7" y="453.5" text-anchor="middle">A small checker</text>
<text class="sub" x="1648.7" y="470.4" text-anchor="middle">trained only on the experts&#x27; samples;</text>
<text class="sub" x="1648.7" y="488.2" text-anchor="middle">reads &quot;both concepts present&quot; from x_t</text>
</g>
<g class="node" id="n-p_sample" style="--k:var(--k-service)">
<rect class="shape" x="1090.2" y="568.0" width="277" height="100" rx="10"/>
<text class="eyebrow" x="1228.7" y="585.6" text-anchor="middle">sampling time</text>
<text class="label" x="1228.7" y="604.6" text-anchor="middle">Merge, then push</text>
<text class="sub" x="1228.7" y="621.5" text-anchor="middle">each expert on its own region (CLEVR),</text>
<text class="sub" x="1228.7" y="639.3" text-anchor="middle">or a plain product (Colored MNIST);</text>
<text class="sub" x="1228.7" y="657.1" text-anchor="middle">then the checker&#x27;s gradient pushes</text>
</g>
<g class="node" id="n-p_eval" style="--k:var(--k-loss)">
<rect class="shape" x="1090.2" y="728.0" width="277" height="100" rx="10"/>
<text class="eyebrow" x="1228.7" y="745.6" text-anchor="middle">what Paper 1 scores</text>
<text class="label" x="1228.7" y="764.6" text-anchor="middle">Objects and their effects, scored</text>
<text class="sub" x="1228.7" y="781.5" text-anchor="middle">objects kept as experts are added (7 on</text>
<text class="sub" x="1228.7" y="799.3" text-anchor="middle">CLEVR); a shadow on the other object;</text>
<text class="sub" x="1228.7" y="817.1" text-anchor="middle">a finding hiding the heart&#x27;s edge (X-ray)</text>
</g>
<rect class="pill" x="331.5" y="203.5" width="114.4" height="34" rx="9"/>
<text class="edge-label" x="337.5" y="216.3">nothing crosses:</text>
<text class="edge-label" x="337.5" y="232.3">own data only</text>
<rect class="pill" x="181.7" y="361.0" width="204.0" height="34" rx="9"/>
<text class="edge-label" x="187.7" y="373.8">crosses: weights, peer to peer</text>
<text class="edge-label" x="187.7" y="389.8">training, 1 to 3 rounds (p9)</text>
<rect class="pill" x="391.7" y="361.0" width="204.0" height="34" rx="9"/>
<text class="edge-label" x="397.7" y="373.8">crosses: weights to the server</text>
<text class="edge-label" x="397.7" y="389.8">training, once (p9)</text>
<rect class="pill" x="99.1" y="521.0" width="159.2" height="34" rx="9"/>
<text class="edge-label" x="105.1" y="533.8">every expert&#x27;s velocity</text>
<text class="edge-label" x="105.1" y="549.8">sampling, every step</text>
<rect class="pill" x="509.5" y="521.0" width="178.4" height="34" rx="9"/>
<text class="edge-label" x="515.5" y="533.8">crosses: the student, back</text>
<text class="edge-label" x="515.5" y="549.8">to every silo, once (p9)</text>
<rect class="pill" x="1171.5" y="203.5" width="114.4" height="34" rx="9"/>
<text class="edge-label" x="1177.5" y="216.3">nothing crosses:</text>
<text class="edge-label" x="1177.5" y="232.3">own data only</text>
<rect class="pill" x="1418.8" y="281.0" width="178.4" height="34" rx="9"/>
<text class="edge-label" x="1424.8" y="293.8">crosses: generated samples</text>
<text class="edge-label" x="1424.8" y="309.8">after training</text>
<rect class="pill" x="1117.1" y="437.0" width="223.2" height="34" rx="9"/>
<text class="edge-label" x="1123.1" y="449.8">crosses: each expert&#x27;s prediction</text>
<text class="edge-label" x="1123.1" y="465.8">sampling, every step</text>
<rect class="pill" x="1578.7" y="542.0" width="140.0" height="34" rx="9"/>
<text class="edge-label" x="1584.7" y="554.8">checker&#x27;s gradient</text>
<text class="edge-label" x="1584.7" y="570.8">sampling, every step</text>
<rect class="pill" x="786.1" y="745.0" width="255.2" height="66" rx="9"/>
<text class="edge-label" x="792.1" y="757.8">the assumption that separates them:</text>
<text class="edge-label" x="792.1" y="773.8">DCFM forces the attributes to be</text>
<text class="edge-label" x="792.1" y="789.8">independent, so effects that need both</text>
<text class="edge-label" x="792.1" y="805.8">are removed (inferred from Eqs. 7, 12)</text>
</svg>