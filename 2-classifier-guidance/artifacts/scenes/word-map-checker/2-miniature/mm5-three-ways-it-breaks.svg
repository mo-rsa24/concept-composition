<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 760" width="1720" height="760" role="img" aria-label="Three panels: a head trained only on true captions follows the prompt&#x27;s word; a correlation loss has zero gradient on identical maps while the head&#x27;s is 0.7664; identical maps give 0.2 on all five classes and no class means fused." font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<rect width="1720" height="760" fill="#ffffff"/>
<defs><filter id="soft-halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<text font-family="DejaVu Sans" x="40.0" y="48.0" font-size="30" fill="#20313c" font-weight="700" text-anchor="start">Three ways the checker misleads</text>
<text font-family="DejaVu Sans" x="40.0" y="84.0" font-size="20" fill="#566472" font-weight="400" text-anchor="start">All three are the miniature&#x27;s numbers, computed in the key.</text>
<rect x="40.0" y="115.0" width="545.0" height="600.0" rx="8" fill="#fbfbfc" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="64.0" y="158.0" font-size="24" fill="#c0262d" font-weight="700" text-anchor="start">1. It reads the word</text>
<rect x="605.0" y="115.0" width="545.0" height="600.0" rx="8" fill="#fbfbfc" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="629.0" y="158.0" font-size="24" fill="#c86a0a" font-weight="700" text-anchor="start">2. A correlation loss has no pull</text>
<rect x="1170.0" y="115.0" width="545.0" height="600.0" rx="8" fill="#fbfbfc" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="1194.0" y="158.0" font-size="24" fill="#6b7a88" font-weight="700" text-anchor="start">3. No class for fused</text>
<text font-family="DejaVu Sans" x="64.0" y="200.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">Two small heads learn from h (the map)</text>
<text font-family="DejaVu Sans" x="64.0" y="226.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">and τ (the trace of the prompt&#x27;s word).</text>
<rect x="64.0" y="250.0" width="240.0" height="150.0" rx="8" fill="#f6d5d6" stroke="#c0262d" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="184.0" y="307.0" font-size="18" fill="#20313c" font-weight="600" text-anchor="middle">true captions</text>
<text font-family="DejaVu Sans" x="184.0" y="331.1" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">weight on h: 1.63</text>
<text font-family="DejaVu Sans" x="184.0" y="355.2" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">weight on τ: 5.59</text>
<rect x="326.0" y="250.0" width="235.0" height="150.0" rx="8" fill="#d6eddd" stroke="#1d7a3e" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="443.5" y="307.0" font-size="18" fill="#20313c" font-weight="600" text-anchor="middle">both captions</text>
<text font-family="DejaVu Sans" x="443.5" y="331.1" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">weight on h: 11.90</text>
<text font-family="DejaVu Sans" x="443.5" y="355.2" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">weight on τ: 0.00</text>
<text font-family="DejaVu Sans" x="64.0" y="450.0" font-size="20" fill="#20313c" font-weight="700" text-anchor="start">Test: truly left, prompt says &quot;right of&quot;.</text>
<text font-family="DejaVu Sans" x="64.0" y="492.0" font-size="19" fill="#566472" font-weight="400" text-anchor="start">chance of &quot;right of&quot;:</text>
<text font-family="DejaVu Sans" x="64.0" y="540.0" font-size="31" fill="#c0262d" font-weight="700" text-anchor="start">0.9929</text>
<text font-family="DejaVu Sans" x="64.0" y="570.0" font-size="18" fill="#566472" font-weight="400" text-anchor="start">true captions only</text>
<text font-family="DejaVu Sans" x="326.0" y="540.0" font-size="31" fill="#1d7a3e" font-weight="700" text-anchor="start">0.0085</text>
<text font-family="DejaVu Sans" x="326.0" y="570.0" font-size="18" fill="#566472" font-weight="400" text-anchor="start">both captions</text>
<text font-family="DejaVu Sans" x="64.0" y="640.0" font-size="20" fill="#c0262d" font-weight="600" text-anchor="start">The first head obeys the word.</text>
<text font-family="DejaVu Sans" x="64.0" y="670.0" font-size="20" fill="#1d7a3e" font-weight="600" text-anchor="start">The second reads the picture.</text>
<text font-family="DejaVu Sans" x="629.0" y="200.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">Identical maps have correlation 1, its</text>
<text font-family="DejaVu Sans" x="629.0" y="226.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">maximum, so the gradient is exactly 0.</text>
<rect x="629.0" y="250.0" width="240.0" height="150.0" rx="8" fill="#f8e3cc" stroke="#c86a0a" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="749.0" y="307.0" font-size="18" fill="#20313c" font-weight="600" text-anchor="middle">correlation</text>
<text font-family="DejaVu Sans" x="749.0" y="331.1" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">on the fused body</text>
<text font-family="DejaVu Sans" x="749.0" y="355.2" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">grad norm 0.0000</text>
<rect x="891.0" y="250.0" width="235.0" height="150.0" rx="8" fill="#d6eddd" stroke="#1d7a3e" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="1008.5" y="307.0" font-size="18" fill="#20313c" font-weight="600" text-anchor="middle">the head</text>
<text font-family="DejaVu Sans" x="1008.5" y="331.1" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">on the fused body</text>
<text font-family="DejaVu Sans" x="1008.5" y="355.2" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">grad norm 0.7664</text>
<text font-family="DejaVu Sans" x="629.0" y="450.0" font-size="20" fill="#20313c" font-weight="700" text-anchor="start">Nudge the cat&#x27;s top-left number by 0.1:</text>
<text font-family="DejaVu Sans" x="629.0" y="492.0" font-size="19" fill="#566472" font-weight="400" text-anchor="start">correlation&#x27;s gradient norm is only</text>
<text font-family="DejaVu Sans" x="629.0" y="540.0" font-size="31" fill="#c86a0a" font-weight="700" text-anchor="start">0.000382</text>
<text font-family="DejaVu Sans" x="629.0" y="620.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">On SDXL the maps are not identical</text>
<text font-family="DejaVu Sans" x="629.0" y="646.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">(overlap 0.506 to 0.814), so this is the</text>
<text font-family="DejaVu Sans" x="629.0" y="672.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">limit case, not the cause of the 0 of 8.</text>
<text font-family="DejaVu Sans" x="1194.0" y="200.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">Identical maps give every class the</text>
<text font-family="DejaVu Sans" x="1194.0" y="226.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">same probability.</text>
<rect x="1204.0" y="280.0" width="70.0" height="120.0" rx="0" fill="#eceef1" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="1239.0" y="268.0" font-size="20" fill="#20313c" font-weight="600" text-anchor="middle">0.2</text>
<text font-family="DejaVu Sans" x="1239.0" y="428.0" font-size="16" fill="#566472" font-weight="400" text-anchor="middle">above</text>
<rect x="1300.0" y="280.0" width="70.0" height="120.0" rx="0" fill="#eceef1" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="1335.0" y="268.0" font-size="20" fill="#20313c" font-weight="600" text-anchor="middle">0.2</text>
<text font-family="DejaVu Sans" x="1335.0" y="428.0" font-size="16" fill="#566472" font-weight="400" text-anchor="middle">below</text>
<rect x="1396.0" y="280.0" width="70.0" height="120.0" rx="0" fill="#eceef1" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="1431.0" y="268.0" font-size="20" fill="#20313c" font-weight="600" text-anchor="middle">0.2</text>
<text font-family="DejaVu Sans" x="1431.0" y="428.0" font-size="16" fill="#566472" font-weight="400" text-anchor="middle">left</text>
<rect x="1492.0" y="280.0" width="70.0" height="120.0" rx="0" fill="#eceef1" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="1527.0" y="268.0" font-size="20" fill="#20313c" font-weight="600" text-anchor="middle">0.2</text>
<text font-family="DejaVu Sans" x="1527.0" y="428.0" font-size="16" fill="#566472" font-weight="400" text-anchor="middle">right</text>
<rect x="1588.0" y="280.0" width="70.0" height="120.0" rx="0" fill="#eceef1" stroke="#6b7a88" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="1623.0" y="268.0" font-size="20" fill="#20313c" font-weight="600" text-anchor="middle">0.2</text>
<text font-family="DejaVu Sans" x="1623.0" y="428.0" font-size="16" fill="#566472" font-weight="400" text-anchor="middle">neutral</text>
<text font-family="DejaVu Sans" x="1194.0" y="490.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">The head can say &quot;I don&#x27;t know which side&quot;.</text>
<text font-family="DejaVu Sans" x="1194.0" y="520.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">It has no way to say &quot;these are one body&quot;.</text>
<text font-family="DejaVu Sans" x="1194.0" y="590.0" font-size="20" fill="#c0262d" font-weight="700" text-anchor="start">Learn-to-Steer has no fused class.</text>
<text font-family="DejaVu Sans" x="1194.0" y="620.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">Fusion is the failure our project</text>
<text font-family="DejaVu Sans" x="1194.0" y="646.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">targets, so a head for it needs one</text>
<text font-family="DejaVu Sans" x="1194.0" y="672.0" font-size="19" fill="#20313c" font-weight="400" text-anchor="start">(inferred).</text>
</svg>
