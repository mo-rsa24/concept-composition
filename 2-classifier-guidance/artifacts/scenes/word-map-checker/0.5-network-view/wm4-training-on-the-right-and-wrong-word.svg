<rect x="1370.0" y="300.0" width="230.0" height="170.0" rx="8" fill="#d6eddd" stroke="#1d7a3e" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="1485.0" y="367.0" font-size="18" fill="#20313c" font-weight="600" text-anchor="middle">the head</text>
<text font-family="DejaVu Sans" x="1485.0" y="391.1" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">cross-entropy</text>
<text font-family="DejaVu Sans" x="1485.0" y="415.2" font-size="18" fill="#20313c" font-weight="400" text-anchor="middle">against the picture</text>
<line x1="1302.0" y1="215.0" x2="1332.0" y2="215.0" stroke="#c0262d" stroke-width="2.2"/>
<line x1="1332.0" y1="215.0" x2="1332.0" y2="385.0" stroke="#c0262d" stroke-width="2.2"/>
<line x1="1332.0" y1="385.0" x2="1353.0" y2="385.0" stroke="#c0262d" stroke-width="2.2"/><polygon points="1363.0,385.0 1353.0,381.0 1353.0,389.0" fill="#c0262d"/>
<line x1="1302.0" y1="535.0" x2="1332.0" y2="535.0" stroke="#c0262d" stroke-width="2.2"/>
<line x1="1332.0" y1="535.0" x2="1332.0" y2="385.0" stroke="#c0262d" stroke-width="2.2"/>
<line x1="1332.0" y1="385.0" x2="1353.0" y2="385.0" stroke="#c0262d" stroke-width="2.2"/><polygon points="1363.0,385.0 1353.0,381.0 1353.0,389.0" fill="#c0262d"/>
<text font-family="DejaVu Sans" x="40.0" y="690.0" font-size="22" fill="#20313c" font-weight="700" text-anchor="start">With the wrong caption added, GenEval position rose from 0.425 to 0.57 on FLUX.1-schnell validation (p. 8, Table 4).</text>
<text font-family="DejaVu Sans" x="40.0" y="728.0" font-size="19" fill="#566472" font-weight="400" text-anchor="start">GenEval position is the fraction of images with the right relation, 0 to 1. The paper reports no direct measure of leakage after the fix.</text>
</svg>
