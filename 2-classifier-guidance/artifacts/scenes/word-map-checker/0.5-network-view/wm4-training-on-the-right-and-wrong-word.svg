<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 780" width="1640" height="780" role="img" aria-label="A training picture of a dog left of a cat is inverted under the right caption and a wrong one. Both sets of word maps carry the label left of, so the head cannot use the relation word." font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<rect width="1640" height="780" fill="#ffffff"/>
<defs><filter id="soft-halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<text font-family="DejaVu Sans" x="40.0" y="48.0" font-size="31" fill="#20313c" font-weight="700" text-anchor="start">Why each training picture is inverted twice</text>
<text font-family="DejaVu Sans" x="40.0" y="84.0" font-size="20" fill="#566472" font-weight="400" text-anchor="start">If every caption states the truth, the head can read the relation word&#x27;s trace in the maps and ignore the layout.</text>
