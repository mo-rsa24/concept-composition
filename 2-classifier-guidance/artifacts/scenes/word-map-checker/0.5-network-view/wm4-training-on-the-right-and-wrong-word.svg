<text font-family="DejaVu Sans" x="1172.5" y="554.2" font-size="19" fill="#20313c" font-weight="400" text-anchor="middle">&quot;left of&quot;</text>
<line x1="982.0" y1="535.0" x2="1033.0" y2="535.0" stroke="#c0262d" stroke-width="2.2"/><polygon points="1043.0,535.0 1033.0,531.0 1033.0,539.0" fill="#c0262d"/>
<g opacity="0.035"><rect x="1356.0" y="286.0" width="258.0" height="198.0" rx="24" fill="#1d7a3e" stroke="none" stroke-width="0"/></g>
