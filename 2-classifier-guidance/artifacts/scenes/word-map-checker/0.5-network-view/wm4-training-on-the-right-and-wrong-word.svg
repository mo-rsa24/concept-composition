<rect x="775.0" y="470.0" width="200.0" height="130.0" rx="8" fill="#eceef1" stroke="#6b7a88" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="875.0" y="528.7" font-size="19" fill="#566472" font-weight="600" text-anchor="middle">invert, read</text>
<text font-family="DejaVu Sans" x="875.0" y="554.2" font-size="19" fill="#566472" font-weight="400" text-anchor="middle">the word maps</text>
