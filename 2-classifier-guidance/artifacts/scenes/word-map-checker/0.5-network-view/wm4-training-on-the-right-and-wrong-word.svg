<text font-family="DejaVu Sans" x="1172.5" y="234.2" font-size="19" fill="#20313c" font-weight="400" text-anchor="middle">&quot;left of&quot;</text>
<line x1="982.0" y1="215.0" x2="1033.0" y2="215.0" stroke="#c0262d" stroke-width="2.2"/><polygon points="1043.0,215.0 1033.0,211.0 1033.0,219.0" fill="#c0262d"/>
<rect x="345.0" y="470.0" width="355.0" height="130.0" rx="8" fill="#ffffff" stroke="#6b7a88" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="522.5" y="528.7" font-size="19" fill="#20313c" font-weight="600" text-anchor="middle">wrong caption</text>
<text font-family="DejaVu Sans" x="522.5" y="554.2" font-size="19" fill="#20313c" font-weight="400" text-anchor="middle">&quot;a dog above a cat&quot;</text>
