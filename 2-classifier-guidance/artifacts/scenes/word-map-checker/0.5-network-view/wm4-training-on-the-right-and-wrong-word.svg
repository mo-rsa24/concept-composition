<text font-family="DejaVu Sans" x="522.5" y="208.7" font-size="19" fill="#20313c" font-weight="600" text-anchor="middle">right caption</text>
<text font-family="DejaVu Sans" x="522.5" y="234.2" font-size="19" fill="#20313c" font-weight="400" text-anchor="middle">&quot;a dog to the left of a cat&quot;</text>
<line x1="152.5" y1="293.0" x2="152.0" y2="215.0" stroke="#6b7a88" stroke-width="2.2"/>
<line x1="152.0" y1="215.0" x2="328.0" y2="215.0" stroke="#6b7a88" stroke-width="2.2"/><polygon points="338.0,215.0 328.0,211.0 328.0,219.0" fill="#6b7a88"/>
<rect x="775.0" y="150.0" width="200.0" height="130.0" rx="8" fill="#eceef1" stroke="#6b7a88" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="875.0" y="208.7" font-size="19" fill="#566472" font-weight="600" text-anchor="middle">invert, read</text>
<text font-family="DejaVu Sans" x="875.0" y="234.2" font-size="19" fill="#566472" font-weight="400" text-anchor="middle">the word maps</text>
<line x1="707.0" y1="215.0" x2="758.0" y2="215.0" stroke="#6b7a88" stroke-width="2.2"/><polygon points="768.0,215.0 758.0,211.0 758.0,219.0" fill="#6b7a88"/>
<rect x="1050.0" y="150.0" width="245.0" height="130.0" rx="8" fill="#f6d5d6" stroke="#c0262d" stroke-width="1.6"/>
