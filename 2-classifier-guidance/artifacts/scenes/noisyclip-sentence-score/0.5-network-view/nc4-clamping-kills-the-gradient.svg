<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800" role="img" aria-label="The clamp has slope one between 0 and 255 and slope zero outside it. On unit-variance noise it clamps 26.8 percent of red, 11.4 percent of green and 7.0 percent of blue values." font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<rect width="1700" height="800" fill="#ffffff"/>
<defs><filter id="soft-halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<text font-family="DejaVu Sans" x="30.0" y="44.0" font-size="28" fill="#2b3440" font-weight="700" text-anchor="start">Where the map leaves 0 to 255, the clamp passes no gradient</text>
<rect x="150.0" y="160.0" width="162.4" height="500.0" rx="0" fill="#e6e9ec" stroke="none" stroke-width="0"/>
<rect x="657.6" y="160.0" width="162.4" height="500.0" rx="0" fill="#e6e9ec" stroke="none" stroke-width="0"/>
<line x1="150.0" y1="660.0" x2="820.0" y2="660.0" stroke="#2b3440" stroke-width="1.4"/><line x1="150.0" y1="660.0" x2="150.0" y2="160.0" stroke="#2b3440" stroke-width="1.4"/>
<line x1="312.4" y1="660.0" x2="312.4" y2="667.0" stroke="#2b3440" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="312.4" y="690.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">0</text>
<line x1="447.8" y1="660.0" x2="447.8" y2="667.0" stroke="#2b3440" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="447.8" y="690.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">100</text>
<line x1="583.1" y1="660.0" x2="583.1" y2="667.0" stroke="#2b3440" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="583.1" y="690.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">200</text>
<line x1="657.6" y1="660.0" x2="657.6" y2="667.0" stroke="#2b3440" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="657.6" y="690.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">255</text>
<line x1="143.0" y1="660.0" x2="150.0" y2="660.0" stroke="#2b3440" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="137.0" y="666.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="end">0</text>
<line x1="143.0" y1="180.0" x2="150.0" y2="180.0" stroke="#2b3440" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="137.0" y="186.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="end">255</text>
<text font-family="DejaVu Sans" x="485.0" y="728.0" font-size="19" fill="#2b3440" font-weight="400" text-anchor="middle">value from the linear map, before the clamp (RGB units)</text>
<text font-family="DejaVu Sans" x="30.0" y="138.0" font-size="19" fill="#2b3440" font-weight="400" text-anchor="start">value after the clamp (RGB units)</text>
<line x1="150.0" y1="660.0" x2="312.4" y2="660.0" stroke="#6b7a88" stroke-width="4"/><line x1="312.4" y1="660.0" x2="657.6" y2="180.0" stroke="#5fa877" stroke-width="4"/><line x1="657.6" y1="180.0" x2="820.0" y2="180.0" stroke="#6b7a88" stroke-width="4"/>
<text font-family="DejaVu Sans" x="231.2" y="330.0" font-size="19" fill="#6b7a88" font-weight="700" text-anchor="middle">slope 0</text>
<text font-family="DejaVu Sans" x="231.2" y="358.0" font-size="17" fill="#6b7a88" font-weight="400" text-anchor="middle">no gradient</text>
<text font-family="DejaVu Sans" x="738.8" y="408.0" font-size="19" fill="#6b7a88" font-weight="700" text-anchor="middle">slope 0</text>
<text font-family="DejaVu Sans" x="738.8" y="436.0" font-size="17" fill="#6b7a88" font-weight="400" text-anchor="middle">no gradient</text>
<text font-family="DejaVu Sans" x="464.0" y="562.1" font-size="19" fill="#5fa877" font-weight="700" text-anchor="start">slope 1</text>
<text font-family="DejaVu Sans" x="464.0" y="587.1" font-size="17" fill="#5fa877" font-weight="400" text-anchor="start">gradient passes</text>
<text font-family="DejaVu Sans" x="980.0" y="160.0" font-size="21" fill="#2b3440" font-weight="700" text-anchor="start">Share of pixels clamped, unit-variance noise</text>
<text font-family="DejaVu Sans" x="980.0" y="188.0" font-size="16" fill="#5f6b78" font-weight="400" text-anchor="start">computed from the weights, independent channels</text>
<text font-family="DejaVu Sans" x="1048.0" y="264.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="end">red</text>
<rect x="1070.0" y="230.0" width="153.3" height="50.0" rx="0" fill="#bcc3c9" stroke="none" stroke-width="0"/><rect x="1223.3" y="230.0" width="293.3" height="50.0" rx="0" fill="#6b7a88" stroke="none" stroke-width="0"/>
<text font-family="DejaVu Sans" x="1528.7" y="263.0" font-size="22" fill="#2b3440" font-weight="700" text-anchor="start">26.8%</text>
<text font-family="DejaVu Sans" x="1048.0" y="356.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="end">green</text>
<rect x="1070.0" y="322.0" width="65.0" height="50.0" rx="0" fill="#bcc3c9" stroke="none" stroke-width="0"/><rect x="1135.0" y="322.0" width="123.3" height="50.0" rx="0" fill="#6b7a88" stroke="none" stroke-width="0"/>
<text font-family="DejaVu Sans" x="1270.3" y="355.0" font-size="22" fill="#2b3440" font-weight="700" text-anchor="start">11.4%</text>
<text font-family="DejaVu Sans" x="1048.0" y="448.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="end">blue</text>
<rect x="1070.0" y="414.0" width="53.3" height="50.0" rx="0" fill="#bcc3c9" stroke="none" stroke-width="0"/><rect x="1123.3" y="414.0" width="63.3" height="50.0" rx="0" fill="#6b7a88" stroke="none" stroke-width="0"/>
<text font-family="DejaVu Sans" x="1198.7" y="447.0" font-size="22" fill="#2b3440" font-weight="700" text-anchor="start">7.0%</text>
<line x1="1070.0" y1="214.0" x2="1070.0" y2="500.0" stroke="#2b3440" stroke-width="1.2"/>
<rect x="1070.0" y="520.0" width="18.0" height="18.0" rx="0" fill="#bcc3c9" stroke="none" stroke-width="0"/>
<text font-family="DejaVu Sans" x="1096.0" y="536.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="start">below 0</text>
<rect x="1200.0" y="520.0" width="18.0" height="18.0" rx="0" fill="#6b7a88" stroke="none" stroke-width="0"/>
<text font-family="DejaVu Sans" x="1226.0" y="536.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="start">above 255</text>
<rect x="980.0" y="575.0" width="600.0" height="112.0" rx="9" fill="#f6f7f9" stroke="#c9d0d7" stroke-width="1.1"/>
<text font-family="DejaVu Sans" x="1280.0" y="618.0" font-size="19" fill="#2b3440" font-weight="400" text-anchor="middle">29.5% of pixels have at least one colour clamped</text>
<text font-family="DejaVu Sans" x="1280.0" y="656.0" font-size="19" fill="#2b3440" font-weight="400" text-anchor="middle">4.6% have all three clamped and send back nothing</text>
</svg>
