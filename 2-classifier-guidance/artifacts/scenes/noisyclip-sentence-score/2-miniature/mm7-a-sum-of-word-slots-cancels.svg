<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 900" width="1760" height="900" role="img" aria-label="A sentence built as a sum of word slots: averaging both orders cancels the swap" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<rect width="1760" height="900" fill="#ffffff"/>
<defs><filter id="soft-halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<text font-family="DejaVu Sans" x="30.0" y="44.0" font-size="26" fill="#2b3440" font-weight="700" text-anchor="start">A sentence built as a sum of word slots: averaging both orders cancels the swap</text>
<text font-family="DejaVu Sans" x="30.0" y="130.0" font-size="20" fill="#2b3440" font-weight="700" text-anchor="start">Word-slot vectors</text>
<text font-family="DejaVu Sans" x="470.0" y="130.0" font-size="20" fill="#2b3440" font-weight="700" text-anchor="start">Four sentences, as sums</text>
<text font-family="DejaVu Sans" x="1330.0" y="130.0" font-size="20" fill="#2b3440" font-weight="700" text-anchor="start">Average both orders</text>
<text font-family="DejaVu Sans" x="30.0" y="196.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">cat in the first slot</text>
<rect x="300.0" y="168.0" width="120.0" height="44.0" rx="8" fill="#e3dcf6" stroke="#b9a7e8" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="360.0" y="195.9" font-size="17" fill="#2b3440" font-weight="400" text-anchor="middle">(2, 1, 0)</text>
<text font-family="DejaVu Sans" x="30.0" y="262.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">dog in the first slot</text>
<rect x="300.0" y="234.0" width="120.0" height="44.0" rx="8" fill="#e3dcf6" stroke="#b9a7e8" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="360.0" y="261.9" font-size="17" fill="#2b3440" font-weight="400" text-anchor="middle">(0, 1, 2)</text>
<text font-family="DejaVu Sans" x="30.0" y="328.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">cat in the second slot</text>
<rect x="300.0" y="300.0" width="120.0" height="44.0" rx="8" fill="#e3dcf6" stroke="#b9a7e8" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="360.0" y="327.9" font-size="17" fill="#2b3440" font-weight="400" text-anchor="middle">(1, 0, 1)</text>
<text font-family="DejaVu Sans" x="30.0" y="394.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">dog in the second slot</text>
<rect x="300.0" y="366.0" width="120.0" height="44.0" rx="8" fill="#e3dcf6" stroke="#b9a7e8" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="360.0" y="393.9" font-size="17" fill="#2b3440" font-weight="400" text-anchor="middle">(0, 2, 1)</text>
<text font-family="DejaVu Sans" x="30.0" y="460.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">&quot;to the left of&quot;</text>
<rect x="300.0" y="432.0" width="120.0" height="44.0" rx="8" fill="#e3dcf6" stroke="#b9a7e8" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="360.0" y="459.9" font-size="17" fill="#2b3440" font-weight="400" text-anchor="middle">(0, 0, 1)</text>
<text font-family="DejaVu Sans" x="30.0" y="526.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">&quot;to the right of&quot;</text>
<rect x="300.0" y="498.0" width="120.0" height="44.0" rx="8" fill="#e3dcf6" stroke="#b9a7e8" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="360.0" y="526.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="middle">(1, 0, 0)</text>
<text font-family="DejaVu Sans" x="470.0" y="174.0" font-size="16" fill="#5f6b78" font-weight="700" text-anchor="start">same meaning</text>
<text font-family="DejaVu Sans" x="470.0" y="220.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">a cat to the left of a dog</text>
<text font-family="DejaVu Sans" x="730.0" y="220.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="start">(2, 1, 0) + (0, 0, 1) + (0, 2, 1)</text>
<rect x="1150.0" y="194.0" width="120.0" height="40.0" rx="8" fill="#cec1ef" stroke="#8d76d1" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1210.0" y="219.6" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">(2, 3, 2)</text>
<text font-family="DejaVu Sans" x="470.0" y="316.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">a dog to the right of a cat</text>
<text font-family="DejaVu Sans" x="730.0" y="316.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="start">(0, 1, 2) + (1, 0, 0) + (1, 0, 1)</text>
<rect x="1150.0" y="290.0" width="120.0" height="40.0" rx="8" fill="#cec1ef" stroke="#8d76d1" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1210.0" y="315.6" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">(2, 1, 3)</text>
<text font-family="DejaVu Sans" x="470.0" y="396.0" font-size="16" fill="#5f6b78" font-weight="700" text-anchor="start">nouns swapped</text>
<text font-family="DejaVu Sans" x="470.0" y="442.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">a dog to the left of a cat</text>
<text font-family="DejaVu Sans" x="730.0" y="442.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="start">(0, 1, 2) + (0, 0, 1) + (1, 0, 1)</text>
<rect x="1150.0" y="416.0" width="120.0" height="40.0" rx="8" fill="#cec1ef" stroke="#8d76d1" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1210.0" y="441.6" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">(1, 1, 4)</text>
<text font-family="DejaVu Sans" x="470.0" y="538.0" font-size="17" fill="#2b3440" font-weight="400" text-anchor="start">a cat to the right of a dog</text>
<text font-family="DejaVu Sans" x="730.0" y="538.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="start">(2, 1, 0) + (1, 0, 0) + (0, 2, 1)</text>
<rect x="1150.0" y="512.0" width="120.0" height="40.0" rx="8" fill="#cec1ef" stroke="#8d76d1" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1210.0" y="537.6" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">(3, 3, 1)</text>
<text font-family="DejaVu Sans" x="1330.0" y="232.0" font-size="16" fill="#5f6b78" font-weight="700" text-anchor="start">sum, same meaning</text>
<rect x="1330.0" y="244.0" width="150.0" height="44.0" rx="8" fill="#cec1ef" stroke="#8d76d1" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1405.0" y="272.3" font-size="18" fill="#2b3440" font-weight="400" text-anchor="middle">(4, 4, 5)</text>
<text font-family="DejaVu Sans" x="1330.0" y="454.0" font-size="16" fill="#5f6b78" font-weight="700" text-anchor="start">sum, nouns swapped</text>
<rect x="1330.0" y="466.0" width="150.0" height="44.0" rx="8" fill="#cec1ef" stroke="#8d76d1" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1405.0" y="494.3" font-size="18" fill="#2b3440" font-weight="400" text-anchor="middle">(4, 4, 5)</text>
<rect x="1330.0" y="610.0" width="400.0" height="120.0" rx="10" fill="#e6e9ec" stroke="#6b7a88" stroke-width="1.6"/>
<text font-family="DejaVu Sans" x="1530.0" y="652.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">w = sum same meaning − sum swapped</text>
<text font-family="DejaVu Sans" x="1530.0" y="700.0" font-size="30" fill="#2b3440" font-weight="700" text-anchor="middle">(0, 0, 0)</text>
<text font-family="DejaVu Sans" x="1530.0" y="770.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">Every word slot appears once</text>
<text font-family="DejaVu Sans" x="1530.0" y="794.0" font-size="16" fill="#2b3440" font-weight="400" text-anchor="middle">on each side, so all of it cancels.</text>
<text font-family="DejaVu Sans" x="30.0" y="870.0" font-size="15" fill="#5f6b78" font-weight="400" text-anchor="start">Toy with hand-set 3-number vectors, not made unit length: it explains the cancellation and predicts nothing about CLIP.</text>
</svg>
