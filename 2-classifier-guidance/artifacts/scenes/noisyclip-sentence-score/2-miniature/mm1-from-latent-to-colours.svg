<text font-family="DejaVu Sans" x="640.0" y="484.0" font-size="18" fill="#2b3440" font-weight="400" text-anchor="middle">60(1) + 5(−1) + 15(0) + 50(−0.5) + 140</text>
<text font-family="DejaVu Sans" x="1070.0" y="484.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="middle">230</text>
<rect x="1210.0" y="460.0" width="120.0" height="36.0" rx="8" fill="#cfecd6" stroke="#5fa877" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1270.0" y="484.3" font-size="18" fill="#2b3440" font-weight="400" text-anchor="middle">230</text>
<text font-family="DejaVu Sans" x="1460.0" y="484.0" font-size="18" fill="#3b7d50" font-weight="400" text-anchor="middle">yes</text>
<text font-family="DejaVu Sans" x="236.0" y="540.0" font-size="21" fill="#3f73c9" font-weight="700" text-anchor="middle">B</text>
<text font-family="DejaVu Sans" x="640.0" y="540.0" font-size="18" fill="#2b3440" font-weight="400" text-anchor="middle">60(1) − 10(−1) + 5(0) + 35(−0.5) + 130</text>
<text font-family="DejaVu Sans" x="1070.0" y="540.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="middle">197.5</text>
<rect x="1210.0" y="516.0" width="120.0" height="36.0" rx="8" fill="#cfecd6" stroke="#5fa877" stroke-width="1.3"/>
<text font-family="DejaVu Sans" x="1270.0" y="540.3" font-size="18" fill="#2b3440" font-weight="400" text-anchor="middle">197.5</text>
<text font-family="DejaVu Sans" x="1460.0" y="540.0" font-size="18" fill="#3b7d50" font-weight="400" text-anchor="middle">yes</text>
<rect x="40.0" y="616.0" width="1560.0" height="86.0" rx="9" fill="#f6f7f9" stroke="#c9d0d7" stroke-width="1.1"/>
<text font-family="DejaVu Sans" x="820.0" y="668.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="middle">Pixel B red lands at 305. The clamp holds it at 255, so nothing passes back along that colour.</text>
<text font-family="DejaVu Sans" x="30.0" y="750.0" font-size="16" fill="#5f6b78" font-weight="400" text-anchor="start">Toy with hand-set weights: it shows the mechanics and predicts nothing about SDXL.</text>
</svg>
