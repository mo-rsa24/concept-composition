<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 790" width="1640" height="790" role="img" aria-label="The real linear map worked for two pixels. Pixel B red is 305 before the clamp and 255 after it, so it passes no gradient." font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<rect width="1640" height="790" fill="#ffffff"/>
<defs><filter id="soft-halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<text font-family="DejaVu Sans" x="30.0" y="44.0" font-size="28" fill="#2b3440" font-weight="700" text-anchor="start">The released map, on pixel A and pixel B</text>
<text font-family="DejaVu Sans" x="70.0" y="124.0" font-size="18" fill="#5f6b78" font-weight="700" text-anchor="start">pixel</text>
<text font-family="DejaVu Sans" x="210.0" y="124.0" font-size="18" fill="#5f6b78" font-weight="700" text-anchor="start">colour</text>
<text font-family="DejaVu Sans" x="640.0" y="124.0" font-size="18" fill="#5f6b78" font-weight="700" text-anchor="middle">60 z₀ − 60 z₁ … + bias</text>
<text font-family="DejaVu Sans" x="1070.0" y="124.0" font-size="18" fill="#5f6b78" font-weight="700" text-anchor="middle">before clamp</text>
<text font-family="DejaVu Sans" x="1270.0" y="124.0" font-size="18" fill="#5f6b78" font-weight="700" text-anchor="middle">after clamp</text>
<text font-family="DejaVu Sans" x="1460.0" y="124.0" font-size="18" fill="#5f6b78" font-weight="700" text-anchor="middle">gradient?</text>
<line x1="40.0" y1="142.0" x2="1600.0" y2="142.0" stroke="#2b3440" stroke-width="1.2"/>
<text font-family="DejaVu Sans" x="60.0" y="250.0" font-size="28" fill="#2b3440" font-weight="700" text-anchor="start">A</text>
<text font-family="DejaVu Sans" x="60.0" y="280.0" font-size="13" fill="#5f6b78" font-weight="400" text-anchor="start">(1, 0.5, 0, 0.5)</text>
<text font-family="DejaVu Sans" x="236.0" y="216.0" font-size="21" fill="#d1495b" font-weight="700" text-anchor="middle">R</text>
<text font-family="DejaVu Sans" x="640.0" y="216.0" font-size="18" fill="#2b3440" font-weight="400" text-anchor="middle">60(1) − 60(0.5) + 25(0) − 70(0.5) + 150</text>
<text font-family="DejaVu Sans" x="1070.0" y="216.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="middle">145</text>
