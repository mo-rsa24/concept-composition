<text font-family="DejaVu Sans" x="1460.0" y="328.0" font-size="18" fill="#3b7d50" font-weight="400" text-anchor="middle">yes</text>
<line x1="40.0" y1="376.0" x2="1600.0" y2="376.0" stroke="#c9d0d7" stroke-width="1.0"/>
<text font-family="DejaVu Sans" x="60.0" y="462.0" font-size="28" fill="#2b3440" font-weight="700" text-anchor="start">B</text>
<text font-family="DejaVu Sans" x="60.0" y="492.0" font-size="13" fill="#5f6b78" font-weight="400" text-anchor="start">(1, −1, 0, −0.5)</text>
