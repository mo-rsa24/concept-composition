<text font-family="DejaVu Sans" x="1460.0" y="216.0" font-size="18" fill="#3b7d50" font-weight="400" text-anchor="middle">yes</text>
<text font-family="DejaVu Sans" x="236.0" y="272.0" font-size="21" fill="#3f9b5f" font-weight="700" text-anchor="middle">G</text>
