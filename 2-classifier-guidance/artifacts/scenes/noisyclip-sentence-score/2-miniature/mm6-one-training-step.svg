<text font-family="DejaVu Sans" x="860.0" y="584.0" font-size="20" fill="#2b3440" font-weight="400" text-anchor="middle">Each cell is the score times a toy scale of 10. Real NoisyCLIP multiplies by 98.86.</text>
<text font-family="DejaVu Sans" x="860.0" y="626.0" font-size="19" fill="#2b3440" font-weight="400" text-anchor="middle">I1 and I2 are the same two pixels in swapped order, each paired with its own sentence T1 or T2.</text>
<text font-family="DejaVu Sans" x="860.0" y="668.0" font-size="19" fill="#2b3440" font-weight="400" text-anchor="middle">The loss is the mean of the cross-entropy over rows and over columns.</text>
