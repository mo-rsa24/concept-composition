    <text style="font-size: 9.75px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20313c" x="36" y="489.6" transform="rotate(-0 36 489.6)">Count asks for both logits up, so both move right. Identity asks for apart up and wrong down; the wrong canvas's larger error (0.587 against −0.316)</text>
   </g>
   <g id="text_26">
    <text style="font-size: 9.75px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20313c" x="36" y="506.88" transform="rotate(-0 36 506.88)">wins the shared weights, so both logits move left and the gap between them barely changes. The head has to find a difference between the two canvases' maps to separate them.</text>
