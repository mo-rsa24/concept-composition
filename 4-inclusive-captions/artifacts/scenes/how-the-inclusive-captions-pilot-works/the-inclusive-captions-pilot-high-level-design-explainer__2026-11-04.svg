<svg class="hld" style="--fs:13.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2764 848" width="2764" height="848" role="img" aria-labelledby="hld-t hld-d">
<title id="hld-t">The inclusive-captions pilot: high-level design</title><desc id="hld-d">Two SDXL LoRAs on the same 491 COCO photos, differing in one cell of a caption table, read on 128 shared seeds. Drawn 2026-11-04 from the plan and the code.</desc>
<style>
svg.hld{font-size:var(--fs,13px);--hld-bg:#f6f7fa;--hld-ink:#18202e;--hld-muted:#566074;--hld-line:#5f6a7e;--hld-box:#ffffff;
--hld-group:#eceff5;--hld-group-line:#b4bccb;--hld-pill:#ffffff;
--k-client:#2f62d8;--k-edge:#7a4fe0;--k-service:#0b8a78;--k-worker:#566a86;--k-store:#c4701a;
--k-cache:#c93a3a;--k-queue:#a67c00;--k-files:#8a6a3c;--k-external:#6b7383;--k-assumed:#b0457a;--k-tensor:#2f7d6b;--k-encoder:#3a6fd8;--k-decoder:#8a4fd0;--k-block:#4a5a78;--k-op:#b06a1a;--k-loss:#b0457a;--hld-lane:#eef2f8;--hld-lane-line:#c3cbd9}
svg.hld .tensor-frame{fill:none;stroke:var(--k);stroke-width:1.4}
svg.hld .tensor-frame.dashed{stroke-dasharray:4 3}
svg.hld .cell{stroke:none}
svg.hld .lane{fill:var(--hld-lane);stroke:var(--hld-lane-line);stroke-width:1;stroke-dasharray:5 4}
svg.hld .lane-label{fill:var(--hld-muted);font-size:.80em;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
svg.hld .repeat-brace{fill:none;stroke:var(--hld-muted);stroke-width:1.2}
svg.hld .repeat-label{fill:var(--hld-muted);font-size:.82em;font-style:italic}
svg.hld .ellipsis{fill:var(--hld-muted);font-size:20px;letter-spacing:.14em}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) svg.hld, svg.hld:root{--hld-bg:#11151d;--hld-ink:#e7eaf1;--hld-muted:#9ba4b6;
--hld-line:#97a1b4;--hld-box:#1a202b;--hld-group:#161b25;--hld-group-line:#3a4354;--hld-pill:#1a202b;
--k-client:#7fa3ff;--k-edge:#b394ff;--k-service:#4fd1bc;--k-worker:#9fb0c8;--k-store:#f2a55a;--k-tensor:#55c4ac;--k-encoder:#7fa3ff;--k-decoder:#c0a0ff;--k-block:#9fb0c8;--k-op:#f0a460;--k-loss:#f08ab8;--hld-lane:#151b26;--hld-lane-line:#333d4e;
--k-cache:#ff8080;--k-queue:#e8c04a;--k-files:#d3b07f;--k-external:#a9b0be;--k-assumed:#f08cbd}}
:root[data-theme="dark"] svg.hld{--hld-bg:#11151d;--hld-ink:#e7eaf1;--hld-muted:#9ba4b6;
--hld-line:#97a1b4;--hld-box:#1a202b;--hld-group:#161b25;--hld-group-line:#3a4354;--hld-pill:#1a202b;
--k-client:#7fa3ff;--k-edge:#b394ff;--k-service:#4fd1bc;--k-worker:#9fb0c8;--k-store:#f2a55a;
--k-cache:#ff8080;--k-queue:#e8c04a;--k-files:#d3b07f;--k-external:#a9b0be;--k-assumed:#f08cbd}
svg.hld{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
svg.hld .bg{fill:var(--hld-bg)}
svg.hld .title{fill:var(--hld-ink);font-size:1.55em;font-weight:700;letter-spacing:-.01em}
svg.hld .subtitle{fill:var(--hld-muted);font-size:.92em}
svg.hld .group{fill:var(--hld-group);stroke:var(--hld-group-line);stroke-width:1.2;stroke-dasharray:5 4}
svg.hld .group-label{fill:var(--hld-muted);font-size:.82em;font-weight:600;letter-spacing:.04em}
svg.hld .shape{fill:color-mix(in srgb,var(--k) 11%,var(--hld-box));stroke:var(--k);stroke-width:1.6}
svg.hld .shape.dashed{stroke-dasharray:6 4}
svg.hld .shape.planned{stroke-dasharray:1.5 3.5;stroke-linecap:round;stroke-width:2.2}
svg.hld .rim{fill:none;stroke:var(--k);stroke-width:1.6}
svg.hld .eyebrow{fill:var(--k);font-size:.70em;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
svg.hld .label{fill:var(--hld-ink);font-size:1em;font-weight:650;letter-spacing:-.005em}
svg.hld .sub{fill:var(--hld-muted);font-size:.80em;letter-spacing:.005em}
svg.hld .badge{fill:#ffffff;stroke:#d5dae3;stroke-width:1}
svg.hld .edge{fill:none;stroke:var(--hld-line);stroke-width:1.5}
svg.hld .edge.async{stroke-dasharray:7 5}
svg.hld .edge.optional{stroke-dasharray:2 4;opacity:.8}
svg.hld .arrow{fill:var(--hld-line)}
svg.hld .pill{fill:var(--hld-pill);stroke:var(--hld-group-line);stroke-width:1}
svg.hld .edge-label{fill:var(--hld-ink);font-size:.80em}
svg.hld .step{fill:var(--hld-ink)}
svg.hld .step-num{fill:var(--hld-bg);font-size:10px;font-weight:700}
</style>
